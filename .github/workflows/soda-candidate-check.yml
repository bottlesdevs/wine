name: soda-candidate-check
on:
  push:
    branches:
      - 'feat/soda-next'
    paths:
      - '.github/workflows/soda-candidate-check.yml'
permissions:
  actions: read
  contents: read
env:
  SOURCE_RUN_ID: '33350163776'
  SOURCE_ARTIFACT: 'pre-test-soda-11.0-7-2ac66ab-x86_64'
  COMPONENT_NAME: 'soda-11.0-7-2ac66ab-x86_64'
  PROTON_COMMIT: 'b7a763327f0cb76e9e0bd53dc4de95dee0d4c3b7'
  OPENXR_SDK_COMMIT: '8899a91c17ce9618f565f42408b47db1d6e9ccc7'
  MONADO_VERSION: '21.0.0+git2905.e26a272c1~dfsg1-2build2'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            file \
            g++-mingw-w64-x86-64 \
            "libopenxr1-monado=$MONADO_VERSION" \
            mesa-vulkan-drivers \
            "monado-service=$MONADO_VERSION" \
            ninja-build \
            xvfb \
            xz-utils

      - name: prepare pinned sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /OpenXR-SDK /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --depth=1 OpenXR-SDK
          test "$(git -C /tmp/proton/OpenXR-SDK rev-parse HEAD)" = "$OPENXR_SDK_COMMIT"

      - name: download runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/soda-runner
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/soda-runner
          mapfile -t runner_bins < <(find /tmp/soda-runner -path '*/bin/wine' -print)
          test "${#runner_bins[@]}" -eq 1
          runner_dir="${runner_bins[0]%/bin/wine}"
          test -x "$runner_dir/bin/wine"
          printf '%s\n' "$runner_dir" > /tmp/soda-runner-dir

      - name: verify OpenXR outside Steam
        run: |
          runner_dir="$(cat /tmp/soda-runner-dir)"
          mkdir -p /tmp/soda-openxr/app /tmp/soda-openxr/runtime /tmp/soda-openxr/xdg/openxr/1
          chmod 700 /tmp/soda-openxr/runtime

          cmake -S /tmp/proton/OpenXR-SDK -B /tmp/soda-openxr/loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_API_LAYERS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF \
            -DBUILD_LOADER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_WITH_SYSTEM_JSONCPP=OFF \
            -DDYNAMIC_LOADER=ON
          cmake --build /tmp/soda-openxr/loader-build --target openxr_loader --parallel 2
          loader_dll="$(find /tmp/soda-openxr/loader-build -type f -iname '*openxr_loader.dll' -print -quit)"
          test -n "$loader_dll"
          cp "$loader_dll" /tmp/soda-openxr/app/openxr_loader.dll
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            source="$(x86_64-w64-mingw32-g++ -print-file-name="$dll")"
            test ! -f "$source" || cp "$source" "/tmp/soda-openxr/app/$dll"
          done
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-openxr-smoke.c" \
            -I /tmp/proton/OpenXR-SDK/include -O2 -o /tmp/soda-openxr/app/soda-openxr-smoke.exe

          monado_manifest=/usr/share/openxr/1/openxr_monado.json
          lavapipe_manifest="$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' -print -quit)"
          test -f "$monado_manifest"
          test -n "$lavapipe_manifest"
          ln -s "$monado_manifest" /tmp/soda-openxr/xdg/openxr/1/active_runtime.json
          export XDG_CONFIG_HOME=/tmp/soda-openxr/xdg
          export XDG_RUNTIME_DIR=/tmp/soda-openxr/runtime
          export VK_ICD_FILENAMES="$lavapipe_manifest"
          export SIMULATED_ENABLE=1
          export XRT_COMPOSITOR_NULL=1
          export XRT_LOG=info
          test -z "${XR_RUNTIME_JSON:-}"

          Xvfb :98 -screen 0 1024x768x24 >/tmp/soda-openxr/xvfb.log 2>&1 &
          xvfb_pid=$!
          mkfifo /tmp/soda-openxr/monado-input
          exec 3<>/tmp/soda-openxr/monado-input
          monado-service </tmp/soda-openxr/monado-input >/tmp/soda-openxr/monado.log 2>&1 &
          monado_pid=$!
          cleanup() {
            kill "$monado_pid" "$xvfb_pid" 2>/dev/null || true
            exec 3>&-
          }
          trap cleanup EXIT
          export DISPLAY=:98
          for attempt in {1..100}; do
            test ! -S /tmp/.X11-unix/X98 || break
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X98
          kill -0 "$xvfb_pid"
          for attempt in {1..100}; do
            test ! -S "$XDG_RUNTIME_DIR/monado_comp_ipc" || break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/monado_comp_ipc"
          kill -0 "$monado_pid"

          unset SteamAppId SteamGameId SteamOverlayGameId STEAM_COMPAT_CLIENT_INSTALL_PATH STEAM_COMPAT_DATA_PATH
          for process in steam steamwebhelper vrcompositor vrserver; do
            if pgrep -x "$process"; then
              exit 1
            fi
          done
          export WINEPREFIX=/tmp/soda-openxr/prefix
          export WINEARCH=win64
          export SODA_OPENXR_RUNTIME=host
          export WINEDEBUG=+openxr
          mkdir -p "$WINEPREFIX"
          "$runner_dir/bin/wineboot" -u
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json \
            "$WINEPREFIX/drive_c/openxr/wineopenxr64.json"
          "$runner_dir/bin/wine" reg query 'HKLM\Software\Khronos\OpenXR\1' \
            /v ActiveRuntime >/tmp/soda-openxr/registry.log
          grep -F 'C:\openxr\wineopenxr64.json' /tmp/soda-openxr/registry.log
          (
            cd /tmp/soda-openxr/app
            "$runner_dir/bin/wine" soda-openxr-smoke.exe
          ) >/tmp/soda-openxr/application.log 2>&1
          grep -F 'runtime=Monado' /tmp/soda-openxr/application.log
          grep -F 'system=Simulated HMD' /tmp/soda-openxr/application.log
          "$runner_dir/bin/wineserver" -w

      - name: package
        run: |
          runner_dir="$(cat /tmp/soda-runner-dir)"
          test -f "$runner_dir/lib/wine/x86_64-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-windows/winegstreamer.dll"
          test -x "$runner_dir/bin/wine64"
          file "$runner_dir/lib/wine/x86_64-windows/ntdll.dll" | grep -F 'x86-64'
          file "$runner_dir/lib/wine/i386-windows/ntdll.dll" | grep -F 'Intel 80386'
          test -f "$runner_dir/lib/wine/x86_64-windows/wineopenxr.dll"
          test -f "$runner_dir/lib/wine/x86_64-unix/wineopenxr.so"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json \
            "$runner_dir/share/openxr/wineopenxr64.json"
          mv "$runner_dir" "/tmp/$COMPONENT_NAME"
          tar -C /tmp -cJf "/tmp/$COMPONENT_NAME.tar.xz" "$COMPONENT_NAME"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPONENT_NAME }}
          path: /tmp/${{ env.COMPONENT_NAME }}.tar.xz
          if-no-files-found: error

      - name: upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-check-logs
          path: /tmp/soda-openxr/*.log
          if-no-files-found: ignore
