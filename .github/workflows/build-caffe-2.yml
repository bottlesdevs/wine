name: build-caffe-2
on:
  push:
    branches:
      - 'caffe'
  workflow_dispatch:
env:
  WINE_VERSION: '10.0'
  WINE_TKG_COMMIT: 6e1c41342a249e0029c1f35f36775e1caa5ce1d1
  BUILD_TOOLS_COMMIT: fcba104217c6daddddebe69d2dc2e39bc9025848
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: setup
        working-directory: /home/runner/work/
        run: |
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'

      - name: clone wine-tkg-git repo
        working-directory: /home/runner/work/
        run: |
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          git -C wine-tkg-git checkout "$WINE_TKG_COMMIT"

      - name: get/set the caffe recipe
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          curl --fail --show-error --location "https://raw.githubusercontent.com/bottlesdevs/build-tools/$BUILD_TOOLS_COMMIT/runners/vaniglia/wine-tkg.cfg" >> customization.cfg
          echo '_LOCAL_PRESET="none"' >> customization.cfg
          echo '_proton_eac_support="false"' >> customization.cfg
          sed -i "s/_staging_version=\"\"/_staging_version=\"v$WINE_VERSION\"/g" customization.cfg
          sed -i "s/_plain_version=\"\"/_plain_version=\"wine-$WINE_VERSION\"/g" customization.cfg

      - name: start build
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: ./non-makepkg-build.sh

      - name: Verify patches
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: "! grep -q 'Patch application has failed' prepare.log"
        
      - name: Upload prepare.log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: /home/runner/work/wine-tkg-git/wine-tkg-git/prepare.log
          if-no-files-found: ignore

      - name: package
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/
        run: |
          runner=$(find . -maxdepth 1 -type d -name 'wine-tkg-staging-*' -print -quit)
          test -n "$runner"
          version=$("$runner/bin/wine" --version)
          escaped_version=${WINE_VERSION//./\\.}
          printf '%s\n' "$version" | grep -Eq "^wine-$escaped_version(\\.r[0-9]+\\.[^[:space:]]+)?([[:space:]]|$)"
          mv "$runner" caffe-$WINE_VERSION-x86_64
          tar cJvf caffe-$WINE_VERSION-x86_64.tar.xz caffe-$WINE_VERSION-x86_64
          mv caffe-$WINE_VERSION-x86_64.tar.xz /tmp/caffe-$WINE_VERSION-x86_64.tar.xz

      - name: Verify package
        run: |
          package=/tmp/caffe-$WINE_VERSION-x86_64.tar.xz
          tar -tJf "$package" > "$RUNNER_TEMP/caffe-files.txt"
          grep -q '/bin/wine$' "$RUNNER_TEMP/caffe-files.txt"
          grep -q '/bin/wineserver$' "$RUNNER_TEMP/caffe-files.txt"

      - name: release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: false
          prerelease: false
          automatic_release_tag: "caffe-${{ env.WINE_VERSION }}"
          title: "Caffe ${{ env.WINE_VERSION }}"
          files: "/tmp/caffe-${{ env.WINE_VERSION }}-x86_64.tar.xz"

      - name: Format release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          printf '%s\n' \
            '<img src="https://raw.githubusercontent.com/bottlesdevs/data/main/logo/caffe-logo.svg" width="64" />' \
            '' \
            'This is a Wine TKG build.' \
            'Built on Ubuntu 24.04.' \
            '' \
            '- Wine 10.0 with Wine Staging' \
            '- Esync and Fsync support' \
            '- 32-bit and 64-bit Windows applications' |
          gh release edit "caffe-$WINE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file -
