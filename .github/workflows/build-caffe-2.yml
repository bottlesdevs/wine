name: build-caffe-2
on:
  push:
    branches:
      - 'caffe'
  workflow_dispatch:
env:
  WINE_VERSION: '10.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup
        working-directory: /home/runner/work/
        run: |
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'

      - name: clone wine-tkg-git repo
        working-directory: /home/runner/work/
        run: git clone https://github.com/Frogging-Family/wine-tkg-git.git

      - name: get/set the caffe recipe
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          curl --fail --show-error --location https://raw.githubusercontent.com/bottlesdevs/build-tools/main/runners/vaniglia/wine-tkg.cfg >> customization.cfg
          echo '_LOCAL_PRESET="none"' >> customization.cfg
          sed -i "s/_staging_version=\"\"/_staging_version=\"v$WINE_VERSION\"/g" customization.cfg
          sed -i "s/_plain_version=\"\"/_plain_version=\"wine-$WINE_VERSION\"/g" customization.cfg

      - name: start build
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: ./non-makepkg-build.sh
        
      - name: Upload prepare.log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: /home/runner/work/wine-tkg-git/wine-tkg-git/prepare.log
          if-no-files-found: ignore

      - name: package
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/
        run: |
          runner=$(find . -maxdepth 1 -type d -name 'wine-tkg-staging-*' -print -quit)
          test -n "$runner"
          version=$("$runner/bin/wine" --version)
          case "$version" in
            "wine-$WINE_VERSION"|"wine-$WINE_VERSION "*) ;;
            *) exit 1 ;;
          esac
          mv "$runner" caffe-$WINE_VERSION-x86_64
          tar cJvf caffe-$WINE_VERSION-x86_64.tar.xz caffe-$WINE_VERSION-x86_64
          mv caffe-$WINE_VERSION-x86_64.tar.xz /tmp/caffe-$WINE_VERSION-x86_64.tar.xz

      - name: Verify package
        run: |
          package=/tmp/caffe-$WINE_VERSION-x86_64.tar.xz
          tar -tJf "$package" > "$RUNNER_TEMP/caffe-files.txt"
          grep -q '/bin/wine$' "$RUNNER_TEMP/caffe-files.txt"
          grep -q '/bin/wineserver$' "$RUNNER_TEMP/caffe-files.txt"

      - name: release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: false
          prerelease: false
          automatic_release_tag: "caffe-${{ env.WINE_VERSION }}"
          title: "Caffe ${{ env.WINE_VERSION }}"
          files: "/tmp/caffe-${{ env.WINE_VERSION }}-x86_64.tar.xz"
