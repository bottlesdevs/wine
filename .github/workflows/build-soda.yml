      - name: verify prefix username
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 5
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-prefix
          export WINEARCH=win64
          export USER=soda-ci
          unset WINEUSERNAME
          runtime_log=/tmp/soda-username.log
          mkdir -p "$WINEPREFIX"
          if ! WINEDEBUG=err+all "$runner_dir/bin/wineboot" -u >"$runtime_log" 2>&1; then
            cat "$runtime_log"
            exit 1
          fi
          username_output="$("$runner_dir/bin/wine" cmd /c echo '%USERNAME%' | tr -d '\r')"
          username="$(printf '%s\n' "$username_output" | sed -n '/^soda-ci$/p' | tail -1)"
          if [[ "$username" != soda-ci ]]; then
            printf 'Expected username soda-ci, got:\n%s\n' "$username_output" >&2
            exit 1
          fi
          printf 'Windows username: %s\nWindows profile directories:\n' "$username"
          find "$WINEPREFIX/drive_c/users" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          test -d "$WINEPREFIX/drive_c/users/soda-ci"
          test ! -e "$WINEPREFIX/drive_c/users/steamuser"
          "$runner_dir/bin/wineserver" -w

