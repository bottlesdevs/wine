name: build-soda
on:
  push:
    branches:
      - 'soda'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Candidate architecture'
        required: true
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
permissions:
  contents: read
env:
  WINE_VERSION: '11.0'
  REVISION: '7'
  WINE_TKG_COMMIT: '04ddf86c96817d2f8bb45aefc04c9ad3871ca740'
  VALVE_WINE_TAG: 'experimental-wine-bleeding-edge-11.0-424421-20260830-pa9dd3f-w7af9c6-d70d750-v940e9f'
  VALVE_WINE_COMMIT: '7af9c6934eab520987b114b8bec84bdc58e2ec86'
  PROTON_COMMIT: 'b7a763327f0cb76e9e0bd53dc4de95dee0d4c3b7'
  BUILD_TOOLS_COMMIT: 'fcba104217c6daddddebe69d2dc2e39bc9025848'
  WINE_MONO_VERSION: '10.4.1'
  WINE_MONO_SHA256: '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23'
  RELEASE_NOTES: |-
    <img src="https://raw.githubusercontent.com/bottlesdevs/data/main/logo/soda-logo.svg" width="64" />

    This is a Wine TKG build based on Valve's Wine (experimental bleeding edge) source code.

    - Updated the Valve experimental bleeding edge base to August 25, 2026.
    - Fixed Windows Steam client startup.
    - Fixed a recursive Steam web UI initialization failure.
    - Fixed depth-only display mode changes used by some older games.
    - Fixed Unix paths without a matching DOS drive.
    - Restored true 32-bit prefixes.
    - Added automatic local mod loader support for `version.dll`, `winmm.dll`, and `dsound.dll`.
    - Added opt-in transparent huge pages with `SODA_USE_THP=1`.
    - Added module load profiles for Bottles Adaptive Launch.
jobs:
  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: check Soda patches
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 --branch "$VALVE_WINE_TAG" https://github.com/ValveSoftware/wine.git /tmp/valve-wine
          git -C /tmp/valve-wine sparse-checkout set --no-cone \
            /configure.ac \
            /dlls/advapi32/advapi.c \
            /dlls/dsound/Makefile.in \
            /dlls/version/Makefile.in \
            /dlls/winmm/Makefile.in \
            /dlls/ntdll/unix/file.c \
            /dlls/ntdll/unix/loader.c \
            /dlls/ntdll/unix/virtual.c \
            /dlls/ntdll/loader.c \
            /dlls/windows.ui/uisettings.c \
            /dlls/win32u/sysparams.c \
            /dlls/winewayland.drv/window.c
          git -C /tmp/valve-wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/valve-wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          .github/import-wineopenxr.sh /tmp/valve-wine /tmp/proton/wineopenxr
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            git -C /tmp/valve-wine apply --check "$patch"
          done

  build:
    needs: patches
    if: github.event_name == 'push' || inputs.architecture == 'x86_64'
    runs-on: ubuntu-24.04
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}
      stable: ${{ steps.identity.outputs.stable }}

    steps:        
      - uses: actions/checkout@v7

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          stable=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/soda" ]]; then
            stable=true
          else
            version="$version-${GITHUB_SHA::7}"
          fi
          component_name="soda-$version-x86_64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: setup
        working-directory: /home/runner/work/
        run: |
          mkdir -p /home/runner/.config/frogminer/
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'
          sudo apt install -f
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcap-dev:amd64 libpcap-dev:i386
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libgudev-1.0-dev:amd64 libgudev-1.0-dev:i386
          sudo apt-get install -y libopenxr-dev:amd64 xvfb
          sudo apt-get check

      - name: clone wine-tkg-git repo
        working-directory: /home/runner/work/
        run: |
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          cd wine-tkg-git/wine-tkg-git
          git checkout "$WINE_TKG_COMMIT"
          sed -i "s/_LOCAL_PRESET=\"\"/_LOCAL_PRESET=\"valve-exp-bleeding\"/g" customization.cfg
          sed -i "s|^_bleeding_tag=.*|_bleeding_tag=\"$VALVE_WINE_TAG\"|" wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          sed -i '/^ubuntu_pkgs_64=/ s/libgstreamer-plugins-base1.0-dev/libgstreamer-plugins-base1.0-dev:amd64/' wine-tkg-scripts/deps
          cp "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch wine-tkg-userpatches/
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          sed -i '/      _source_cleanup/a\      "$GITHUB_WORKSPACE/.github/import-wineopenxr.sh" "${srcdir}/${_winesrcdir}" "/tmp/proton/wineopenxr"' non-makepkg-build.sh

      - name: get/set the soda recipe
        working-directory: /home/runner/.config/frogminer/
        run: |
          git clone https://github.com/bottlesdevs/build-tools.git /tmp/build-tools
          git -C /tmp/build-tools checkout "$BUILD_TOOLS_COMMIT"
          cp /tmp/build-tools/runners/vaniglia/wine-tkg-valve.cfg wine-tkg.cfg
          sed -i '$a_NOLIB32="false"' wine-tkg.cfg
          sed -i '$a_configure_userargs32="--disable-wineopenxr"' wine-tkg.cfg
          cat wine-tkg.cfg
      
      - name: start build
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: yes|./non-makepkg-build.sh

      - name: bundle Wine Mono
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          grep -F "#define MONO_VERSION \"$WINE_MONO_VERSION\"" src/ValveSoftware-winegit/dlls/appwiz.cpl/addons.c
          grep -F "#define MONO_SHA \"$WINE_MONO_SHA256\"" src/ValveSoftware-winegit/dlls/appwiz.cpl/addons.c
          curl --fail --location --retry 3 --output "/tmp/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  /tmp/$mono_file" | sha256sum --check -
          install -Dm644 "/tmp/$mono_file" "$runner_dir/share/wine/mono/$mono_file"

      - name: verify prefix username
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-prefix
          export WINEUSERNAME=soda-ci
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          username="$(xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%USERNAME%' | tr -d '\r')"
          test "$username" = soda-ci
          test -d "$WINEPREFIX/drive_c/users/soda-ci"
          test ! -e "$WINEPREFIX/drive_c/users/steamuser"
          "$runner_dir/bin/wineserver" -w

      - name: verify Valve Wine source
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: test "$(git -C src/ValveSoftware-winegit rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
        
      - name: Upload prepare.log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: /home/runner/work/wine-tkg-git/wine-tkg-git/prepare.log
          if-no-files-found: ignore

      - name: package
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="$(find . -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          test -f "$runner_dir/lib/wine/x86_64-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/x86_64-windows/wineopenxr.dll"
          test -f "$runner_dir/lib/wine/x86_64-unix/wineopenxr.so"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          mv "$runner_dir" "$COMPONENT_NAME"
          tar cJvf "$ARCHIVE_NAME" "$COMPONENT_NAME"
          mv "$ARCHIVE_NAME" "/tmp/$ARCHIVE_NAME"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: /tmp/${{ steps.identity.outputs.archive_name }}
          if-no-files-found: error

  arm64:
    needs: patches
    if: github.event_name == 'push' || inputs.architecture == 'aarch64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}

    steps:
      - uses: actions/checkout@v7

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/soda" ]]; then
            version="$version-${GITHUB_SHA::7}"
          fi
          component_name="soda-$version-aarch64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"

      - name: setup
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y docker.io file xvfb xz-utils
          sudo systemctl start docker
          docker version

      - name: prepare sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton checkout "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --recursive wine OpenXR-SDK FEX
          git -C /tmp/proton/wine fetch --no-tags origin "$VALVE_WINE_TAG"
          git -C /tmp/proton/wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/proton/wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            if [[ "$patch" == *wineopenxr-host-runtime.mypatch ]]; then
              continue
            fi
            git -C /tmp/proton/wine apply --check "$patch"
            git -C /tmp/proton/wine apply "$patch"
          done
          git -C /tmp/proton/wineopenxr apply --check "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"
          git -C /tmp/proton/wineopenxr apply "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"

      - name: configure
        run: |
          mkdir /tmp/proton-build
          cd /tmp/proton-build
          /tmp/proton/configure.sh --build-name=soda-arm64 --target-arch=arm64 --container-engine=docker

      - name: build Wine and FEX
        working-directory: /tmp/proton-build
        run: |
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= wine
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= fex
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= fex_unixlib
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= wineopenxr

      - name: package
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          proton_files=/tmp/proton-build/obj-soda-arm64/dist/files
          test -x "$proton_files/bin-arm64/wine"
          test -x "$proton_files/bin-arm64/wineserver"
          mkdir "$runner_dir"
          cp -a "$proton_files"/. "$runner_dir"/
          mv "$runner_dir/bin-arm64" "$runner_dir/bin"
          install -Dm644 /tmp/proton/FEX_Config.json "$runner_dir/share/fex-emu/Config.json"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          curl --fail --location --retry 3 --output "/tmp/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  /tmp/$mono_file" | sha256sum --check -
          install -Dm644 "/tmp/$mono_file" "$runner_dir/share/wine/mono/$mono_file"
          test -f "$runner_dir/lib/wine/aarch64-unix/ntdll.so"
          test -f "$runner_dir/lib/wine/aarch64-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/arm64ec-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/x86_64-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/aarch64-windows/libarm64ecfex.dll"
          test -f "$runner_dir/lib/wine/aarch64-unix/libwow64fex.dll.so"
          test -f "$runner_dir/lib/wine/aarch64-windows/wineopenxr.dll"
          file "$runner_dir/bin/wine" | grep -F 'ARM aarch64'
          if ldd "$runner_dir/bin/wine" | grep -F 'not found'; then
            exit 1
          fi
          tar -C /tmp -cJf "/tmp/$ARCHIVE_NAME" "$COMPONENT_NAME"

      - name: verify Windows architectures
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          export FEX_APP_CONFIG="$runner_dir/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$runner_dir/share/fex-emu"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-arm64-prefix
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          native_arch="$(xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%PROCESSOR_ARCHITECTURE%' | tr -d '\r')"
          test "$native_arch" = ARM64
          x64_cmd="$runner_dir/lib/wine/x86_64-windows/cmd.exe"
          test -f "$x64_cmd"
          x64_arch="$(xvfb-run -a "$runner_dir/bin/wine" "$x64_cmd" /c echo '%PROCESSOR_ARCHITECTURE%' | tr -d '\r')"
          test "$x64_arch" = AMD64
          "$runner_dir/bin/wineserver" -w

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: /tmp/${{ steps.identity.outputs.archive_name }}
          if-no-files-found: error

  release:
    needs:
      - build
      - arm64
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.component_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.arm64.outputs.component_name }}

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          ARM64_ARCHIVE_NAME: ${{ needs.arm64.outputs.archive_name }}
        run: |
          tag="soda-$WINE_VERSION-$REVISION"
          file="$ARCHIVE_NAME"
          arm64_file="$ARM64_ARCHIVE_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          gh release create "$tag" "$file" "$arm64_file" --target "$GITHUB_SHA" --title "Soda $WINE_VERSION-$REVISION" --notes "$RELEASE_NOTES" --latest
