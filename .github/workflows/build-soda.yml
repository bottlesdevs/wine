name: build-soda
on:
  push:
    branches:
      - 'soda'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Candidate architecture'
        required: true
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
      pgo:
        description: 'Build a PGO candidate'
        required: true
        type: boolean
        default: false
      baseline_run_id:
        description: 'Run ID containing the baseline artifact'
        required: false
        type: string
permissions:
  actions: read
  contents: read
env:
  WINE_VERSION: '11.0'
  REVISION: '7'
  WINE_TKG_COMMIT: '04ddf86c96817d2f8bb45aefc04c9ad3871ca740'
  VALVE_WINE_TAG: 'experimental-wine-bleeding-edge-11.0-424421-20260830-pa9dd3f-w7af9c6-d70d750-v940e9f'
  VALVE_WINE_COMMIT: '7af9c6934eab520987b114b8bec84bdc58e2ec86'
  PROTON_COMMIT: 'b7a763327f0cb76e9e0bd53dc4de95dee0d4c3b7'
  OPENXR_SDK_COMMIT: '8899a91c17ce9618f565f42408b47db1d6e9ccc7'
  BUILD_TOOLS_COMMIT: 'fcba104217c6daddddebe69d2dc2e39bc9025848'
  MONADO_VERSION: '21.0.0+git2905.e26a272c1~dfsg1-2build2'
  WINE_MONO_VERSION: '10.4.1'
  WINE_MONO_SHA256: '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23'
  RELEASE_NOTES: |-
    <img src="https://raw.githubusercontent.com/bottlesdevs/data/main/logo/soda-logo.svg" width="64" />

    This is a Wine TKG build based on Valve's Wine (experimental bleeding edge) source code.

    - Updated the Valve experimental bleeding edge base to August 30, 2026 and Wine-TKG to `04ddf86c`.
    - Adaptive Launch now learns from separate sessions, ranks recurring early module loads, limits stored data, and migrates existing profiles.
    - Added host OpenXR outside Steam and SteamVR, enabled by Bottles and verified against Monado in CI.
    - Preserved each bottle's configured Windows username when Wine updates a prefix.
    - Limited Heroes of Might and Magic VII to eight reported CPUs by default while preserving explicit `WINE_CPU_TOPOLOGY` values.
    - Kept Valve fixes for child-window fullscreen presentation and long URLs opened through `ShellExecute`.
    - Built the x86_64 package with measured PGO and gated it against a non-PGO candidate.
    - Added an aarch64 package with ARM64, ARM64EC, bundled FEX for x86_64 programs, and host OpenXR support.
    - Built and verified both packages only in GitHub Actions from pinned sources, with immutable release assets.
jobs:
  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: check Soda patches
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 --branch "$VALVE_WINE_TAG" https://github.com/ValveSoftware/wine.git /tmp/valve-wine
          git -C /tmp/valve-wine sparse-checkout set --no-cone \
            /configure.ac \
            /dlls/advapi32/advapi.c \
            /dlls/dsound/Makefile.in \
            /dlls/version/Makefile.in \
            /dlls/winmm/Makefile.in \
            /dlls/ntdll/unix/file.c \
            /dlls/ntdll/unix/loader.c \
            /dlls/ntdll/unix/virtual.c \
            /dlls/ntdll/loader.c \
            /dlls/windows.ui/uisettings.c \
            /dlls/win32u/sysparams.c \
            /dlls/winewayland.drv/window.c
          git -C /tmp/valve-wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/valve-wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          .github/import-wineopenxr.sh /tmp/valve-wine /tmp/proton/wineopenxr
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            git -C /tmp/valve-wine apply --check "$patch"
          done

  build:
    needs: patches
    if: github.event_name == 'push' || inputs.architecture == 'x86_64'
    runs-on: ubuntu-24.04
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}
      pgo: ${{ steps.identity.outputs.pgo }}
      stable: ${{ steps.identity.outputs.stable }}

    steps:        
      - uses: actions/checkout@v7

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          pgo=false
          stable=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/soda" ]]; then
            pgo=true
            stable=true
          else
            version="$version-${GITHUB_SHA::7}"
            if [[ "${{ inputs.pgo }}" == "true" ]]; then
              pgo=true
              version="$version-pgo"
            fi
          fi
          component_name="soda-$version-x86_64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"
          echo "pgo=$pgo" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: setup
        working-directory: /home/runner/work/
        run: |
          mkdir -p /home/runner/.config/frogminer/
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'
          sudo apt install -f
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcap-dev:amd64 libpcap-dev:i386
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libgudev-1.0-dev:amd64 libgudev-1.0-dev:i386
          sudo apt-get install -y \
            cmake \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            libopenxr-dev:amd64 \
            "libopenxr1-monado=$MONADO_VERSION" \
            mesa-vulkan-drivers \
            "monado-service=$MONADO_VERSION" \
            ninja-build \
            xvfb
          sudo apt-get check

      - name: clone wine-tkg-git repo
        working-directory: /home/runner/work/
        run: |
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          cd wine-tkg-git/wine-tkg-git
          git checkout "$WINE_TKG_COMMIT"
          sed -i "s/_LOCAL_PRESET=\"\"/_LOCAL_PRESET=\"valve-exp-bleeding\"/g" customization.cfg
          sed -i "s|^_bleeding_tag=.*|_bleeding_tag=\"$VALVE_WINE_TAG\"|" wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          sed -i '/^ubuntu_pkgs_64=/ s/libgstreamer-plugins-base1.0-dev/libgstreamer-plugins-base1.0-dev:amd64/' wine-tkg-scripts/deps
          cp "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch wine-tkg-userpatches/
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /OpenXR-SDK /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --depth=1 OpenXR-SDK
          test "$(git -C /tmp/proton/OpenXR-SDK rev-parse HEAD)" = "$OPENXR_SDK_COMMIT"
          sed -i '/      _source_cleanup/a\      "$GITHUB_WORKSPACE/.github/import-wineopenxr.sh" "${srcdir}/${_winesrcdir}" "/tmp/proton/wineopenxr"' non-makepkg-build.sh

      - name: get/set the soda recipe
        working-directory: /home/runner/.config/frogminer/
        run: |
          git clone https://github.com/bottlesdevs/build-tools.git /tmp/build-tools
          git -C /tmp/build-tools checkout "$BUILD_TOOLS_COMMIT"
          cp /tmp/build-tools/runners/vaniglia/wine-tkg-valve.cfg wine-tkg.cfg
          sed -i '$a_NOLIB32="false"' wine-tkg.cfg
          sed -i '$a_configure_userargs32="--disable-wineopenxr"' wine-tkg.cfg
          if [[ "${{ steps.identity.outputs.pgo }}" == "true" ]]; then
            mkdir -p /tmp/soda-pgo/profiles /tmp/soda-pgo/evidence
            sed -i '$a_GCC_FLAGS="-O2 -pipe -msse3 -mfpmath=sse -ftree-vectorize -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -fprofile-generate=/tmp/soda-pgo/profiles -fprofile-update=prefer-atomic"' wine-tkg.cfg
            sed -i '$a_LD_FLAGS="-Wl,-O1,--sort-common,--as-needed -fprofile-generate=/tmp/soda-pgo/profiles"' wine-tkg.cfg
          fi
          cat wine-tkg.cfg
      
      - name: start build
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: yes|./non-makepkg-build.sh

      - name: train PGO build
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-pgo-training.c" \
            -O2 -municode -ladvapi32 -lgdi32 -o /tmp/soda-pgo/training64.exe
          i686-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-pgo-training.c" \
            -O2 -municode -ladvapi32 -lgdi32 -o /tmp/soda-pgo/training32.exe
          export SODA_RUNNER_DIR="$PWD/$runner_dir"
          xvfb-run -a bash -c '
            export WINEDEBUG=-all
            export WINEPREFIX=/tmp/soda-pgo/prefix64
            export WINEARCH=win64
            mkdir -p "$WINEPREFIX"
            "$SODA_RUNNER_DIR/bin/wineboot" -u
            "$SODA_RUNNER_DIR/bin/wine" reg add "HKCU\Software\SodaPGO" /v Architecture /d win64 /f
            "$SODA_RUNNER_DIR/bin/wine" cmd /c ver
            "$SODA_RUNNER_DIR/bin/wine" /tmp/soda-pgo/training64.exe
            "$SODA_RUNNER_DIR/bin/wine" /tmp/soda-pgo/training32.exe
            "$SODA_RUNNER_DIR/bin/wineserver" -w
            export WINEPREFIX=/tmp/soda-pgo/prefix32
            export WINEARCH=win32
            mkdir -p "$WINEPREFIX"
            "$SODA_RUNNER_DIR/bin/wineboot" -u
            "$SODA_RUNNER_DIR/bin/wine" reg add "HKCU\Software\SodaPGO" /v Architecture /d win32 /f
            "$SODA_RUNNER_DIR/bin/wine" cmd /c ver
            "$SODA_RUNNER_DIR/bin/wine" /tmp/soda-pgo/training32.exe
            "$SODA_RUNNER_DIR/bin/wineserver" -w
          '
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' -size +0c \
            -printf '%s %p\n' | sort > /tmp/soda-pgo/evidence/profile-inventory.txt
          profile_count="$(wc -l < /tmp/soda-pgo/evidence/profile-inventory.txt)"
          test "$profile_count" -gt 0
          grep -F wineserver /tmp/soda-pgo/evidence/profile-inventory.txt
          first_profile="$(find /tmp/soda-pgo/profiles -type f -name '*.gcda' -size +0c -print -quit)"
          gcov-dump -l "$first_profile" > /tmp/soda-pgo/evidence/profile-dump.txt
          grep -Eq 'runs=[1-9]|sum_max=[1-9]' /tmp/soda-pgo/evidence/profile-dump.txt

      - name: rebuild with PGO profiles
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/
        run: |
          build_root=/home/runner/work/wine-tkg-git
          test "$PWD" = /home/runner/work/
          test -f "$build_root/wine-tkg-git/non-makepkg-build.sh"
          find "$build_root" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          cd wine-tkg-git/wine-tkg-git
          git checkout "$WINE_TKG_COMMIT"
          sed -i "s/_LOCAL_PRESET=\"\"/_LOCAL_PRESET=\"valve-exp-bleeding\"/g" customization.cfg
          sed -i "s|^_bleeding_tag=.*|_bleeding_tag=\"$VALVE_WINE_TAG\"|" wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          sed -i '/^ubuntu_pkgs_64=/ s/libgstreamer-plugins-base1.0-dev/libgstreamer-plugins-base1.0-dev:amd64/' wine-tkg-scripts/deps
          cp "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch wine-tkg-userpatches/
          sed -i '/      _source_cleanup/a\      "$GITHUB_WORKSPACE/.github/import-wineopenxr.sh" "${srcdir}/${_winesrcdir}" "/tmp/proton/wineopenxr"' non-makepkg-build.sh
          recipe=/home/runner/.config/frogminer/wine-tkg.cfg
          sed -i '/^_GCC_FLAGS=/d; /^_LD_FLAGS=/d' "$recipe"
          sed -i '$a_GCC_FLAGS="-O2 -pipe -msse3 -mfpmath=sse -ftree-vectorize -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-missing-profile -fprofile-use=/tmp/soda-pgo/profiles -fprofile-correction -fprofile-partial-training"' "$recipe"
          sed -i '$a_LD_FLAGS="-Wl,-O1,--sort-common,--as-needed -fprofile-use=/tmp/soda-pgo/profiles"' "$recipe"
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' -exec touch -a -d @1 {} +
          touch /tmp/soda-pgo/profile-use-start
          set +o pipefail
          yes | ./non-makepkg-build.sh 2>&1 | tee /tmp/soda-pgo/evidence/profile-use-build.log
          build_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$build_status" -eq 0
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' \
            -anewer /tmp/soda-pgo/profile-use-start -printf '%p\n' \
            > /tmp/soda-pgo/evidence/consumed-profiles.txt
          consumed_count="$(wc -l < /tmp/soda-pgo/evidence/consumed-profiles.txt)"
          test "$consumed_count" -gt 0
          grep -F wineserver /tmp/soda-pgo/evidence/consumed-profiles.txt

      - name: bundle Wine Mono
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          grep -F "#define MONO_VERSION \"$WINE_MONO_VERSION\"" src/ValveSoftware-winegit/dlls/appwiz.cpl/addons.c
          grep -F "#define MONO_SHA \"$WINE_MONO_SHA256\"" src/ValveSoftware-winegit/dlls/appwiz.cpl/addons.c
          curl --fail --location --retry 3 --output "/tmp/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  /tmp/$mono_file" | sha256sum --check -
          install -Dm644 "/tmp/$mono_file" "$runner_dir/share/wine/mono/$mono_file"

      - name: verify prefix username
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-prefix
          export USER=soda-ci
          unset WINEUSERNAME
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          username="$(xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%USERNAME%' | tr -d '\r')"
          test "$username" = soda-ci
          test -d "$WINEPREFIX/drive_c/users/soda-ci"
          test ! -e "$WINEPREFIX/drive_c/users/steamuser"
          "$runner_dir/bin/wineserver" -w

      - name: verify compatibility fixes
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          git -C src/ValveSoftware-winegit merge-base --is-ancestor 2a667e28ba7800288f5873a4b13bc0baf6e4a857 HEAD
          git -C src/ValveSoftware-winegit merge-base --is-ancestor 9358696fe9a2261329f4a83aa6a65fd436106154 HEAD
          grep -F 'winebrowser.exe"" ""%1' src/ValveSoftware-winegit/loader/wine.inf.in
          grep -F 'toplevel == hwnd && NtUserGetPresentRect' src/ValveSoftware-winegit/dlls/winex11.drv/init.c

          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-compatibility-smoke.c" \
            -O2 -municode -lshell32 -o /tmp/soda-compatibility-smoke.exe
          mkdir /tmp/soda-browser-bin
          printf '%s\n' '#!/bin/sh' 'printf "%s" "$1" > /tmp/soda-browser-url' > /tmp/soda-browser-bin/xdg-open
          chmod +x /tmp/soda-browser-bin/xdg-open
          export PATH="/tmp/soda-browser-bin:$PATH"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-url-prefix
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          xvfb-run -a "$runner_dir/bin/wine" reg add 'HKCU\Software\Wine\WineBrowser' /v Browsers /t REG_SZ /d xdg-open /f
          long_url="https://soda.invalid/$(printf 'a%.0s' {1..1024})"
          xvfb-run -a "$runner_dir/bin/wine" /tmp/soda-compatibility-smoke.exe "$long_url"
          for attempt in {1..50}; do
            test ! -f /tmp/soda-browser-url || break
            sleep 0.1
          done
          test "$(cat /tmp/soda-browser-url)" = "$long_url"
          "$runner_dir/bin/wineserver" -w

          export WINEPREFIX=/tmp/soda-topology-prefix
          export WINE_CPU_TOPOLOGY=2
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          cpu_count="$(xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%NUMBER_OF_PROCESSORS%' | tr -d '\r')"
          test "$cpu_count" = 2
          "$runner_dir/bin/wineserver" -w

          unset WINE_CPU_TOPOLOGY WINEDEBUG
          export WINEPREFIX=/tmp/soda-heroes-vii-prefix
          mkdir -p "$WINEPREFIX"
          cp /tmp/soda-compatibility-smoke.exe /tmp/MMH7Game-Win64-Shipping.exe
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          xvfb-run -a "$runner_dir/bin/wine" /tmp/MMH7Game-Win64-Shipping.exe --processors \
            >/tmp/soda-heroes-vii-cpus 2>/tmp/soda-heroes-vii.log
          grep -F 'HACK: limiting Heroes VII CPU topology to ' /tmp/soda-heroes-vii.log
          test "$(tr -d '\r' </tmp/soda-heroes-vii-cpus)" -le 8
          "$runner_dir/bin/wineserver" -w

          export WINEDEBUG=-all
          export WINE_CPU_TOPOLOGY=2
          cpu_count="$(xvfb-run -a "$runner_dir/bin/wine" /tmp/MMH7Game-Win64-Shipping.exe --processors | tr -d '\r')"
          test "$cpu_count" = 2
          "$runner_dir/bin/wineserver" -w

      - name: verify OpenXR outside Steam
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          runner_dir="$PWD/$runner_dir"
          mkdir -p /tmp/soda-openxr/app /tmp/soda-openxr/runtime /tmp/soda-openxr/xdg/openxr/1
          chmod 700 /tmp/soda-openxr/runtime

          cmake -S /tmp/proton/OpenXR-SDK -B /tmp/soda-openxr/loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_API_LAYERS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF \
            -DBUILD_LOADER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_WITH_SYSTEM_JSONCPP=OFF \
            -DDYNAMIC_LOADER=ON
          cmake --build /tmp/soda-openxr/loader-build --target openxr_loader --parallel 2
          loader_dll="$(find /tmp/soda-openxr/loader-build -type f -iname 'openxr_loader.dll' -print -quit)"
          test -n "$loader_dll"
          cp "$loader_dll" /tmp/soda-openxr/app/openxr_loader.dll
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            source="$(x86_64-w64-mingw32-g++ -print-file-name="$dll")"
            test ! -f "$source" || cp "$source" "/tmp/soda-openxr/app/$dll"
          done
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-openxr-smoke.c" \
            -I /tmp/proton/OpenXR-SDK/include -O2 -o /tmp/soda-openxr/app/soda-openxr-smoke.exe

          monado_manifest=/usr/share/openxr/1/openxr_monado.json
          lavapipe_manifest="$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' -print -quit)"
          test -f "$monado_manifest"
          test -n "$lavapipe_manifest"
          ln -s "$monado_manifest" /tmp/soda-openxr/xdg/openxr/1/active_runtime.json
          export XDG_CONFIG_HOME=/tmp/soda-openxr/xdg
          export XDG_RUNTIME_DIR=/tmp/soda-openxr/runtime
          export VK_ICD_FILENAMES="$lavapipe_manifest"
          export SIMULATED_ENABLE=1
          export XRT_COMPOSITOR_NULL=1
          export XRT_LOG=info
          test -z "${XR_RUNTIME_JSON:-}"
          monado-service >/tmp/soda-openxr/monado.log 2>&1 &
          monado_pid=$!
          trap 'kill "$monado_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            test ! -S "$XDG_RUNTIME_DIR/monado_comp_ipc" || break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/monado_comp_ipc"

          unset SteamAppId SteamGameId SteamOverlayGameId STEAM_COMPAT_CLIENT_INSTALL_PATH STEAM_COMPAT_DATA_PATH
          for process in steam steamwebhelper vrcompositor vrserver; do
            if pgrep -x "$process"; then
              exit 1
            fi
          done
          export WINEPREFIX=/tmp/soda-openxr/prefix
          export SODA_OPENXR_RUNTIME=host
          export WINEDEBUG=+openxr
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json \
            "$WINEPREFIX/drive_c/openxr/wineopenxr64.json"
          xvfb-run -a "$runner_dir/bin/wine" reg query 'HKLM\Software\Khronos\OpenXR\1' \
            /v ActiveRuntime >/tmp/soda-openxr/registry.log
          grep -F 'C:\openxr\wineopenxr64.json' /tmp/soda-openxr/registry.log
          (
            cd /tmp/soda-openxr/app
            xvfb-run -a "$runner_dir/bin/wine" soda-openxr-smoke.exe
          ) >/tmp/soda-openxr/application.log 2>&1
          grep -F 'runtime=Monado' /tmp/soda-openxr/application.log
          grep -F 'system=Simulated HMD' /tmp/soda-openxr/application.log
          "$runner_dir/bin/wineserver" -w

      - name: verify Valve Wine source
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: test "$(git -C src/ValveSoftware-winegit rev-parse HEAD)" = "$VALVE_WINE_COMMIT"

      - name: benchmark PGO candidate
        if: steps.identity.outputs.pgo == 'true' && inputs.baseline_run_id != ''
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pgo_runner="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$pgo_runner"
          pgo_runner="$PWD/$pgo_runner"
          mkdir -p /tmp/soda-pgo/baseline /tmp/soda-pgo/baseline-extracted
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/soda-pgo/baseline
          baseline_archive="$(find /tmp/soda-pgo/baseline -type f -name 'soda-*-x86_64.tar.xz' -print -quit)"
          test -n "$baseline_archive"
          tar -C /tmp/soda-pgo/baseline-extracted -xJf "$baseline_archive"
          baseline_runner="$(find /tmp/soda-pgo/baseline-extracted -mindepth 1 -maxdepth 1 -type d -name 'soda-*-x86_64' -print -quit)"
          test -n "$baseline_runner"

          export WINEDEBUG=-all
          Xvfb :99 -screen 0 1024x768x24 >/tmp/soda-pgo/evidence/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          mkdir -p /tmp/soda-pgo/benchmark-baseline /tmp/soda-pgo/benchmark-pgo
          WINEPREFIX=/tmp/soda-pgo/benchmark-baseline "$baseline_runner/bin/wineboot" -u
          WINEPREFIX=/tmp/soda-pgo/benchmark-pgo "$pgo_runner/bin/wineboot" -u

          measure() {
            local label="$1"
            local runner="$2"
            local prefix="$3"
            local sample
            sample="$(WINEPREFIX="$prefix" "$runner/bin/wine" \
              /tmp/soda-pgo/training64.exe --benchmark | tr -d '\r' | \
              sed -n '/^[0-9][0-9]*$/p' | tail -1)"
            test -n "$sample"
            printf '%s\n' "$sample" >> "/tmp/soda-pgo/evidence/$label-samples.txt"
          }

          for trial in {1..9}; do
            if ((trial % 2)); then
              measure baseline "$baseline_runner" /tmp/soda-pgo/benchmark-baseline
              measure pgo "$pgo_runner" /tmp/soda-pgo/benchmark-pgo
            else
              measure pgo "$pgo_runner" /tmp/soda-pgo/benchmark-pgo
              measure baseline "$baseline_runner" /tmp/soda-pgo/benchmark-baseline
            fi
          done
          WINEPREFIX=/tmp/soda-pgo/benchmark-baseline "$baseline_runner/bin/wineserver" -w
          WINEPREFIX=/tmp/soda-pgo/benchmark-pgo "$pgo_runner/bin/wineserver" -w

          baseline_median="$(sort -n /tmp/soda-pgo/evidence/baseline-samples.txt | sed -n '5p')"
          pgo_median="$(sort -n /tmp/soda-pgo/evidence/pgo-samples.txt | sed -n '5p')"
          change="$(awk -v baseline="$baseline_median" -v pgo="$pgo_median" \
            'BEGIN { printf "%.2f", (pgo - baseline) * 100 / baseline }')"
          printf 'baseline_median_us=%s\npgo_median_us=%s\nchange_percent=%s\n' \
            "$baseline_median" "$pgo_median" "$change" \
            > /tmp/soda-pgo/evidence/benchmark.txt
          printf 'PGO benchmark: baseline %s us, candidate %s us, change %s%%\n' \
            "$baseline_median" "$pgo_median" "$change" >> "$GITHUB_STEP_SUMMARY"
          awk -v baseline="$baseline_median" -v pgo="$pgo_median" \
            'BEGIN { exit !(pgo < baseline) }'
        
      - name: Upload prepare.log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /home/runner/work/wine-tkg-git/wine-tkg-git/prepare.log
            /tmp/soda-openxr/*.log
          if-no-files-found: ignore

      - name: package
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="$(find . -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          test -f "$runner_dir/lib/wine/x86_64-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/x86_64-windows/wineopenxr.dll"
          test -f "$runner_dir/lib/wine/x86_64-unix/wineopenxr.so"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          mv "$runner_dir" "$COMPONENT_NAME"
          tar cJvf "$ARCHIVE_NAME" "$COMPONENT_NAME"
          mv "$ARCHIVE_NAME" "/tmp/$ARCHIVE_NAME"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: /tmp/${{ steps.identity.outputs.archive_name }}
          if-no-files-found: error

      - name: upload PGO evidence
        if: steps.identity.outputs.pgo == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pgo-evidence-${{ github.sha }}
          path: /tmp/soda-pgo/evidence/*.txt
          if-no-files-found: error

  arm64:
    needs: patches
    if: github.event_name == 'push' || inputs.architecture == 'aarch64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}

    steps:
      - uses: actions/checkout@v7

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/soda" ]]; then
            version="$version-${GITHUB_SHA::7}"
          fi
          component_name="soda-$version-aarch64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"

      - name: setup
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y file xvfb xz-utils
          command -v docker
          sudo systemctl start docker
          docker version

      - name: prepare sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton checkout "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --recursive wine OpenXR-SDK FEX
          git -C /tmp/proton/wine fetch --no-tags origin "$VALVE_WINE_TAG"
          git -C /tmp/proton/wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/proton/wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            if [[ "$patch" == *wineopenxr-host-runtime.mypatch ]]; then
              continue
            fi
            git -C /tmp/proton/wine apply --check "$patch"
            git -C /tmp/proton/wine apply "$patch"
          done
          git -C /tmp/proton/wineopenxr apply --check "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"
          git -C /tmp/proton/wineopenxr apply "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"

      - name: configure
        run: |
          mkdir /tmp/proton-build
          cd /tmp/proton-build
          /tmp/proton/configure.sh --build-name=soda-arm64 --target-arch=arm64 --container-engine=docker

      - name: build Wine and FEX
        working-directory: /tmp/proton-build
        run: |
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= wine
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= fex
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= fex_unixlib
          make WINE_DEPENDS= WINE_aarch64_DEPENDS= wineopenxr

      - name: package
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          proton_files=/tmp/proton-build/dist/files
          test -x "$proton_files/bin-arm64/wine"
          test -x "$proton_files/bin-arm64/wineserver"
          mkdir "$runner_dir"
          cp -a "$proton_files"/. "$runner_dir"/
          mv "$runner_dir/bin-arm64" "$runner_dir/bin"
          install -Dm644 /tmp/proton/FEX_Config.json "$runner_dir/share/fex-emu/Config.json"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          curl --fail --location --retry 3 --output "/tmp/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  /tmp/$mono_file" | sha256sum --check -
          install -Dm644 "/tmp/$mono_file" "$runner_dir/share/wine/mono/$mono_file"
          test -f "$runner_dir/lib/wine/aarch64-unix/ntdll.so"
          test -f "$runner_dir/lib/wine/aarch64-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/arm64ec-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/x86_64-windows/ntdll.dll"
          test -f "$runner_dir/lib/wine/aarch64-windows/libarm64ecfex.dll"
          test -f "$runner_dir/lib/wine/aarch64-unix/libwow64fex.dll.so"
          test -f "$runner_dir/lib/wine/aarch64-windows/wineopenxr.dll"
          file "$runner_dir/bin/wine" | grep -F 'ARM aarch64'
          if ldd "$runner_dir/bin/wine" | grep -F 'not found'; then
            exit 1
          fi
          tar -C /tmp -cJf "/tmp/$ARCHIVE_NAME" "$COMPONENT_NAME"

      - name: verify Windows architectures
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          export FEX_APP_CONFIG="$runner_dir/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$runner_dir/share/fex-emu"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-arm64-prefix
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          native_arch="$(xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%PROCESSOR_ARCHITECTURE%' | tr -d '\r')"
          test "$native_arch" = ARM64
          x64_cmd="$runner_dir/lib/wine/x86_64-windows/cmd.exe"
          test -f "$x64_cmd"
          x64_arch="$(xvfb-run -a "$runner_dir/bin/wine" "$x64_cmd" /c echo '%PROCESSOR_ARCHITECTURE%' | tr -d '\r')"
          test "$x64_arch" = AMD64
          "$runner_dir/bin/wineserver" -w

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: /tmp/${{ steps.identity.outputs.archive_name }}
          if-no-files-found: error

  release:
    needs:
      - build
      - arm64
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.component_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.arm64.outputs.component_name }}

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          ARM64_ARCHIVE_NAME: ${{ needs.arm64.outputs.archive_name }}
        run: |
          tag="soda-$WINE_VERSION-$REVISION"
          file="$ARCHIVE_NAME"
          arm64_file="$ARM64_ARCHIVE_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          gh release create "$tag" "$file" "$arm64_file" --target "$GITHUB_SHA" --title "Soda $WINE_VERSION-$REVISION" --notes "$RELEASE_NOTES" --latest
