name: build-soda
on:
  push:
    branches:
      - 'soda'
  workflow_dispatch:
    inputs:
      recovery_run:
        description: 'Run with completed Wine builds and package tests'
        required: false
        type: string
      architecture:
        description: 'Candidate architecture'
        required: true
        type: choice
        options:
          - x86_64
          - aarch64
          - aarch64-control
          - compiler-cache
          - d2d-reference
          - registry-reference
          - crypt32-reference
          - msi-reference
          - dbghelp-reference
          - typelib-reference
          - eagle-debugger
        default: x86_64
      pgo:
        description: 'Build a PGO candidate'
        required: true
        type: boolean
        default: false
      winrt_http_reference:
        description: 'Collect native WinRT HTTP header results'
        required: true
        type: boolean
        default: false
      baseline_run_id:
        description: 'Run ID containing the baseline artifact'
        required: false
        type: string
permissions:
  actions: read
  contents: read
env:
  WINE_VERSION: '11.0'
  LLVM_TOOLS_VERSION: '1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'
  REVISION: '35-experimental'
  RELEASE_CODENAME: 'Windows Escape'
  WINE_TKG_COMMIT: '04ddf86c96817d2f8bb45aefc04c9ad3871ca740'
  VALVE_WINE_TAG: 'experimental-wine-bleeding-edge-11.0-428201-20260904-pdf1645-w0509a0-dd7ac25-v35bdee'
  VALVE_WINE_COMMIT: '0509a0b64a4852741364c95bcdc67ae8f74ef11d'
  PROTON_COMMIT: 'b7a763327f0cb76e9e0bd53dc4de95dee0d4c3b7'
  FEX_COMMIT: '1cc4b93e7a71c883ec021b71359f136394dc1f3c'
  OPENXR_SDK_COMMIT: '8899a91c17ce9618f565f42408b47db1d6e9ccc7'
  PGO_BASELINE_RUN_ID: '33972726566'
  BUILD_TOOLS_COMMIT: 'fcba104217c6daddddebe69d2dc2e39bc9025848'
  MONADO_VERSION: '21.0.0+git2905.e26a272c1~dfsg1-2build2'
  WINE_MONO_VERSION: '10.4.1'
  WINE_MONO_SHA256: '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23'
  RELEASE_NOTES: |-
    <img src="https://raw.githubusercontent.com/bottlesdevs/data/main/logo/soda-logo.svg" width="64" />

    This is a Wine TKG build based on Valve's Wine (experimental bleeding edge) source code.

    Soda 11.0-35 Experimental, codenamed Windows Escape, adds application registry hives, MSI fixes and better Eagle crash traces. It remains a prerelease and does not replace the current stable Soda build.

    - Added application registry hives with transaction log recovery.
    - Fixed application hive key permissions and inherited handle lifetime.
    - Fixed MSI enumeration of installed Click-to-Run component clients.
    - Fixed CNG algorithm names in hash OID metadata.
    - Fixed registry handle leaks when querying MSI feature states.
    - Fixed Eagle inline symbol lookup for PE files with build IDs.
    - Recovered caller names and source lines in Eagle after null calls.


jobs:
  eagle-debugger:
    if: inputs.architecture == 'eagle-debugger' && inputs.winrt_http_reference != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: setup debugger tests
        run: |
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-eagle"
          mkdir -p "$work/scratch" "$HOME/.cache/soda-runners/35"
          export TMPDIR="$work/scratch" TMP="$work/scratch" TEMP="$work/scratch"
          printf 'EAGLE_WORK=%s\nTMPDIR=%s/scratch\nTMP=%s/scratch\nTEMP=%s/scratch\n' \
            "$work" "$work" "$work" "$work" >> "$GITHUB_ENV"
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix xvfb xauth \
            libc6:i386 libgcc-s1:i386 libunwind8:i386 \
            libfreetype6:amd64 libfreetype6:i386 libfontconfig1:amd64 libfontconfig1:i386 \
            libx11-6:amd64 libx11-6:i386 libxext6:amd64 libxext6:i386 \
            libxrender1:amd64 libxrender1:i386 libxrandr2:amd64 libxrandr2:i386 \
            libxi6:amd64 libxi6:i386 libxcursor1:amd64 libxcursor1:i386 \
            libxinerama1:amd64 libxinerama1:i386 libxcomposite1:amd64 libxcomposite1:i386 \
            libgnutls30t64:amd64 libgnutls30t64:i386 libdbus-1-3:amd64 libdbus-1-3:i386

      - uses: actions/cache@v5
        with:
          path: ~/.cache/soda-runners/35
          key: soda-debugger-runtime-9a441b144b9f35cc527da30d6a40b5888e934a354a6309d6394bb444046b97d4

      - name: prepare published runner
        run: |
          archive="$HOME/.cache/soda-runners/35/soda-11.0-35-experimental-x86_64.tar.xz"
          if ! test -f "$archive"; then
            curl --fail --location --retry 3 \
              https://github.com/bottlesdevs/wine/releases/download/soda-11.0-35-experimental/soda-11.0-35-experimental-x86_64.tar.xz \
              -o "$archive"
          fi
          printf '%s  %s\n' 9a441b144b9f35cc527da30d6a40b5888e934a354a6309d6394bb444046b97d4 "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$EAGLE_WORK"
          sh eagle/build-debugger.sh "$EAGLE_WORK/package"
          mkdir -p "$EAGLE_WORK/tests"
          for architecture in x86_64 i686; do
            if test "$architecture" = x86_64; then bits=64; else bits=32; fi
            "$architecture-w64-mingw32-gcc" -O0 -g -gdwarf-4 -Wall -Wextra -Werror \
              eagle/tests/target.c -o "$EAGLE_WORK/tests/target$bits.exe"
            "$architecture-w64-mingw32-gcc" -std=c11 -O2 -g -Wall -Wextra -Werror -static \
              eagle/tests/pause.c -ldbghelp -o "$EAGLE_WORK/tests/pause$bits.exe"
          done

      - name: verify offline PE export symbols
        run: |
          EAGLE_PACKAGE="$EAGLE_WORK/package" python3 -S eagle/tests/test_symbols_exports.py \
            > "$EAGLE_WORK/tests/symbols-exports.log" 2>&1

      - name: verify debugger on x86 and x64
        shell: bash
        run: |
          export EAGLE_PACKAGE="$EAGLE_WORK/package" EAGLE_TEST_ROOT="$EAGLE_WORK/tests"
          export EAGLE_TEST_WINE="$EAGLE_WORK/soda-11.0-35-experimental-x86_64/bin/wine"
          export WINEPREFIX="$EAGLE_TEST_ROOT/prefix" WINEARCH=win64 WINEDEBUG=-all
          export WINEDLLOVERRIDES='mscoree=d;winemenubuilder.exe=d' LIBGL_ALWAYS_SOFTWARE=1
          trap 'status=$?; set +e; "${EAGLE_TEST_WINE%/wine}/wineserver" -k; "${EAGLE_TEST_WINE%/wine}/wineserver" -w; exit "$status"' EXIT
          xvfb-run -a sh -ec '
            "$EAGLE_TEST_WINE" wineboot -u
            for bits in 64 32; do
              "$EAGLE_TEST_WINE" "$EAGLE_TEST_ROOT/pause$bits.exe" > "$EAGLE_TEST_ROOT/pause$bits.log" 2>&1
            done
            python3 eagle/tests/integration.py -v
          ' 2>&1 | tee "$EAGLE_TEST_ROOT/integration.log"

      - uses: actions/upload-artifact@v7
        if: always() && env.EAGLE_WORK != ''
        with:
          name: eagle-debugger-${{ github.sha }}
          path: |
            ${{ env.EAGLE_WORK }}/tests/*.log
            ${{ env.EAGLE_WORK }}/tests/*.stderr
            ${{ env.EAGLE_WORK }}/tests/*/manifest.json
            ${{ env.EAGLE_WORK }}/tests/*/events.jsonl
            ${{ env.EAGLE_WORK }}/package/share/eagle/build.json
          retention-days: 7
          if-no-files-found: warn

  dbghelp-reference:
    if: inputs.architecture == 'dbghelp-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: verify exported symbol offsets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-dbghelp-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "DBGHELP_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-dbghelp-exports.c'
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'eagle/tests/export.c'
          $failed = $false
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "exports$bits.exe"
            $dll = Join-Path $work "fixture$bits.dll"
            $obj = Join-Path $work "exports$bits.obj"
            $fixtureObj = Join-Path $work "fixture$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC /LD `"$fixture`" /Fe:`"$dll`" /Fo:`"$fixtureObj`" /link /IMPLIB:`"$work/fixture$bits.lib`"",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link dbghelp.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe $dll | Tee-Object -FilePath (Join-Path $work "exports$bits.log")
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && env.DBGHELP_REFERENCE_DIR != ''
        with:
          name: dbghelp-reference-${{ github.sha }}
          path: ${{ env.DBGHELP_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  crypt32-reference:
    if: inputs.architecture == 'crypt32-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: verify hash OID metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-crypt32-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "CRYPT32_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-crypt32-oid.c'
          $failed = $false
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "oid$bits.exe"
            $obj = Join-Path $work "oid$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link crypt32.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe | Tee-Object -FilePath (Join-Path $work "oid$bits.log")
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && env.CRYPT32_REFERENCE_DIR != ''
        with:
          name: crypt32-reference-${{ github.sha }}
          path: ${{ env.CRYPT32_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  msi-reference:
    if: inputs.architecture == 'msi-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: verify MSI feature handle cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-msi-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "MSI_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-msi-feature-handles.c'
          $failed = $false
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "handles$bits.exe"
            $obj = Join-Path $work "handles$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link msi.lib ntdll.lib advapi32.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe | Tee-Object -FilePath (Join-Path $work "handles$bits.log")
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && env.MSI_REFERENCE_DIR != ''
        with:
          name: msi-reference-${{ github.sha }}
          path: ${{ env.MSI_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  typelib-reference:
    if: inputs.architecture == 'typelib-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: compare imported type library lookup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-typelib-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "TYPELIB_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-typelib-imports.c'
          $results = @()
          $failed = $false
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "imports$bits.exe"
            $obj = Join-Path $work "imports$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link oleaut32.lib ole32.lib uuid.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($baseKind in @(32, 64)) {
              foreach ($aliasKind in @(32, 64)) {
                foreach ($registration in @('one', 'both')) {
                  $name = "$bits-$baseKind-$aliasKind-$registration"
                  $directory = Join-Path $work $name
                  New-Item -ItemType Directory -Path $directory | Out-Null
                  try {
                    $makeMode = if ($registration -eq 'both') { 'make-both' } else { 'make' }
                    $probeMode = if ($registration -eq 'both') { 'probe-both' } else { 'probe' }
                    & $exe $makeMode $baseKind $aliasKind $directory | Tee-Object -FilePath (Join-Path $work "make-$name.log")
                    $prepareExit = $LASTEXITCODE
                    $probeExit = $null
                    if ($prepareExit -eq 0) {
                      if (Test-Path (Join-Path $directory 'base-original.tlb')) { throw 'Original type library was not relocated' }
                      & $exe $probeMode (Join-Path $directory 'importing.tlb') | Tee-Object -FilePath (Join-Path $work "probe-$name.log")
                      $probeExit = $LASTEXITCODE
                      $expected = if ($registration -eq 'both' -and $baseKind -ne $bits) { 84 } else { 42 }
                      $probeText = Get-Content -Raw (Join-Path $work "probe-$name.log")
                      if ($probeExit -ne 0 -or $probeText -notmatch "(?m)^RESOLVED_CONSTANT value=$expected\r?$") { $failed = $true }
                    } else { $failed = $true }
                    $results += [ordered]@{bits=$bits; base_kind=$baseKind; alias_kind=$aliasKind; registration=$registration; prepare_exit=$prepareExit; probe_exit=$probeExit}
                  } finally {
                    & $exe cleanup | Tee-Object -FilePath (Join-Path $work "cleanup-$name.log")
                    if ($LASTEXITCODE -ne 0) { $failed = $true }
                  }
                }
              }
            }
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $work 'results.json')
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && env.TYPELIB_REFERENCE_DIR != ''
        with:
          name: typelib-reference-${{ github.sha }}
          path: ${{ env.TYPELIB_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  http-reference:
    if: inputs.winrt_http_reference == true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: collect WinRT HTTP header results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-http-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "HTTP_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-http-media-reference.c'
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "media$bits.exe"
            $obj = Join-Path $work "media$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /O2 /TC `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link runtimeobject.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe | Tee-Object -FilePath (Join-Path $work "media$bits.jsonl")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        if: always() && env.HTTP_REFERENCE_DIR != ''
        with:
          name: winrt-http-reference-${{ github.sha }}
          path: ${{ env.HTTP_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  registry-reference:
    if: inputs.architecture == 'registry-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: verify application registry hives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-registry-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "REGISTRY_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-registry-app-hive.c'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'wine-tkg-userpatches/registry-hive-codec.mypatch'
          & git -C $work apply --include=server/registry_hive.c --include=server/registry_hive.h $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codec = Join-Path $work 'server/registry_hive.c'
          $includes = Join-Path $work 'server'
          $failed = $false
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "registry$bits.exe"
            $obj = Join-Path $work "registry$bits.obj"
            $codecObject = Join-Path $work "registry-hive$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            $fixtures = Join-Path $work "fixtures$bits"
            New-Item -ItemType Directory -Path $fixtures | Out-Null
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC /c `"$codec`" /I`"$includes`" /Fo:`"$codecObject`"",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /WX /O2 /TC /DREGISTRY_HIVE_CODEC /I`"$includes`" `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link advapi32.lib `"$codecObject`"",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe $fixtures (Join-Path $work "registry$bits.dat") | Tee-Object -FilePath (Join-Path $work "registry$bits.jsonl")
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            if (Get-ChildItem -Force $fixtures) {
              Write-Warning 'Registry fixture files were not removed'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && env.REGISTRY_REFERENCE_DIR != ''
        with:
          name: registry-reference-${{ github.sha }}
          path: ${{ env.REGISTRY_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  d2d-reference:
    if: inputs.architecture == 'd2d-reference' && inputs.winrt_http_reference != true
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: verify scaled Direct2D dashed strokes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:USERPROFILE "artifacts/Soda-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-d2d-reference"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $env:TMPDIR = $work
          $env:TMP = $work
          $env:TEMP = $work
          "D2D_REFERENCE_DIR=$work" | Add-Content $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/soda-d2d-scaled-dashes.cpp'
          foreach ($bits in @(64, 32)) {
            $target = if ($bits -eq 64) { 'amd64' } else { 'x86' }
            $exe = Join-Path $work "dashes$bits.exe"
            $obj = Join-Path $work "dashes$bits.obj"
            $script = Join-Path $work "build$bits.cmd"
            @(
              '@echo off',
              "call `"$vcvars`" $target",
              'if errorlevel 1 exit /b %errorlevel%',
              "cl /nologo /W4 /O2 /EHsc `"$source`" /Fe:`"$exe`" /Fo:`"$obj`" /link d2d1.lib windowscodecs.lib ole32.lib uuid.lib",
              'exit /b %errorlevel%'
            ) | Set-Content -Encoding ascii $script
            & cmd.exe /d /c $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe | Tee-Object -FilePath (Join-Path $work "dashes$bits.log")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        if: always() && env.D2D_REFERENCE_DIR != ''
        with:
          name: d2d-scaled-reference-${{ github.sha }}
          path: ${{ env.D2D_REFERENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

  patches:
    if: inputs.recovery_run == '' && inputs.winrt_http_reference != true && inputs.architecture != 'd2d-reference' && inputs.architecture != 'registry-reference' && inputs.architecture != 'crypt32-reference' && inputs.architecture != 'msi-reference' && inputs.architecture != 'dbghelp-reference' && inputs.architecture != 'typelib-reference' && inputs.architecture != 'eagle-debugger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: check Soda patches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 --branch "$VALVE_WINE_TAG" https://github.com/ValveSoftware/wine.git /tmp/valve-wine
          git -C /tmp/valve-wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/valve-wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          .github/import-msicu.sh /tmp/valve-wine
          .github/import-wineopenxr.sh /tmp/valve-wine /tmp/proton/wineopenxr
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            git -C /tmp/valve-wine apply --check "$patch"
            git -C /tmp/valve-wine apply "$patch"
          done
          grep -F '@ stdcall SLLoadApplicationPolicies(ptr ptr long ptr)' /tmp/valve-wine/dlls/sppc/sppc.spec
          grep -F 'HRESULT WINAPI SLLoadApplicationPolicies' /tmp/valve-wine/dlls/sppc/sppc.c
          for symbol in SL_I_OOB_GRACE_PERIOD SL_E_APPLICATION_POLICIES_MISSING SL_E_AUTHN_CHALLENGE_NOT_SET SL_E_AUTHN_CANT_VERIFY; do
            grep -F "#define $symbol" /tmp/valve-wine/include/slerror.h
          done
          grep -F '@ stdcall GetDispatcherQueueForCurrentThread(ptr)' /tmp/valve-wine/dlls/coremessaging/coremessaging.spec
          grep -F '@ stdcall CalculatePopupWindowPosition(ptr ptr long ptr ptr)' /tmp/valve-wine/dlls/user32/user32.spec
          grep -F '@ stdcall -syscall NtUserCalculatePopupWindowPosition(ptr ptr long ptr ptr)' /tmp/valve-wine/dlls/win32u/win32u.spec

  build:
    needs: patches
    if: inputs.winrt_http_reference != true && (github.event_name == 'push' || inputs.architecture == 'x86_64')
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: /home/runner/.cache/soda-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}
      pgo: ${{ steps.identity.outputs.pgo }}
      publish: ${{ steps.identity.outputs.publish }}
      prerelease: ${{ steps.identity.outputs.prerelease }}

    steps:        
      - uses: actions/checkout@v7

      - name: restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          pgo=false
          publish=false
          prerelease=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/soda" ]]; then
            pgo=true
            publish=true
            if [[ "$REVISION" == *-experimental ]]; then
              prerelease=true
            fi
          else
            version="$version-${GITHUB_SHA::7}"
            if [[ "${{ inputs.pgo }}" == "true" ]]; then
              pgo=true
              version="$version-pgo"
            fi
          fi
          component_name="soda-$version-x86_64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"
          echo "pgo=$pgo" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: setup
        timeout-minutes: 20
        working-directory: /home/runner/work/
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          mkdir -p /home/runner/.config/frogminer/
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt-mark hold grub-common grub-efi-amd64-bin python3 python3-apt shim-signed
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'
          sudo apt install -f
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcap-dev:amd64 libpcap-dev:i386
          sudo apt-get install -y libglib2.0-dev-bin libglib2.0-dev:amd64
          sudo aptitude install -y -o Dpkg::Options::="--force-overwrite" \
            libglib2.0-dev-bin:amd64 \
            libgudev-1.0-dev:amd64 \
            libgudev-1.0-dev:i386 \
            libvulkan-dev:amd64 \
            libvulkan-dev:i386
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcsclite-dev:amd64 libpcsclite-dev:i386
          sudo apt-get install -y libsecret-1-dev:amd64 libsecret-1-0:i386
          bash "$GITHUB_WORKSPACE/.github/soda-secret-headers.sh" "$GITHUB_WORKSPACE/.soda-secret-amd64" amd64
          bash "$GITHUB_WORKSPACE/.github/soda-secret-headers.sh" "$GITHUB_WORKSPACE/.soda-secret-i386" i386
          sudo apt-get install -y \
            g++ \
            ccache \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libjson-c-dev:amd64 \
            libsqlite3-dev:amd64 \
            cmake \
            file \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            libopenxr-dev:amd64 \
            "libopenxr1-monado=$MONADO_VERSION" \
            mesa-vulkan-drivers \
            libgl1-mesa-dri:amd64 \
            libgl1-mesa-dri:i386 \
            libglx-mesa0:amd64 \
            libglx-mesa0:i386 \
            "monado-service=$MONADO_VERSION" \
            ninja-build \
            xvfb
          sudo apt-get check
          mkdir -p "$HOME/artifacts"
          llvm_key="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-llvm.asc"
          curl -fL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$llvm_key"
          printf '%s  %s\n' 8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d "$llvm_key" | sha256sum --check -
          sudo install -m644 "$llvm_key" /usr/share/keyrings/soda-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/soda-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/soda-llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-22=$LLVM_TOOLS_VERSION" "lld-22=$LLVM_TOOLS_VERSION" "llvm-22=$LLVM_TOOLS_VERSION"
          for tool in clang lld-link llvm-objcopy llvm-symbolizer; do
            "/usr/lib/llvm-22/bin/$tool" --version
          done

      - name: initialize compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --version
          ccache --show-config

      - name: clone wine-tkg-git repo
        working-directory: /home/runner/work/
        run: |
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          cd wine-tkg-git/wine-tkg-git
          git checkout "$WINE_TKG_COMMIT"
          sed -i "s/_LOCAL_PRESET=\"\"/_LOCAL_PRESET=\"valve-exp-bleeding\"/g" customization.cfg
          sed -i "s|^_bleeding_tag=.*|_bleeding_tag=\"$VALVE_WINE_TAG\"|" wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          sed -i '/^ubuntu_pkgs_64=/ s/libgstreamer-plugins-base1.0-dev/libgstreamer-plugins-base1.0-dev:amd64/' wine-tkg-scripts/deps
          cp "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch wine-tkg-userpatches/
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton sparse-checkout set --no-cone /OpenXR-SDK /wineopenxr
          git -C /tmp/proton checkout --detach "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --depth=1 OpenXR-SDK
          test "$(git -C /tmp/proton/OpenXR-SDK rev-parse HEAD)" = "$OPENXR_SDK_COMMIT"
          sed -i '/      _source_cleanup/a\      "$GITHUB_WORKSPACE/.github/import-msicu.sh" "${srcdir}/${_winesrcdir}"\n      "$GITHUB_WORKSPACE/.github/import-wineopenxr.sh" "${srcdir}/${_winesrcdir}" "/tmp/proton/wineopenxr"' non-makepkg-build.sh

      - name: get/set the soda recipe
        working-directory: /home/runner/.config/frogminer/
        run: |
          git clone https://github.com/bottlesdevs/build-tools.git /tmp/build-tools
          git -C /tmp/build-tools checkout "$BUILD_TOOLS_COMMIT"
          cp /tmp/build-tools/runners/vaniglia/wine-tkg-valve.cfg wine-tkg.cfg
          sed -i '$a_NOLIB32="false"' wine-tkg.cfg
          sed -i '$a_NOCCACHE="false"' wine-tkg.cfg
          sed -i "\$a_configure_userargs64=\"SECRET_CFLAGS=-I$GITHUB_WORKSPACE/.soda-secret-amd64/include SECRET_LIBS=-L$GITHUB_WORKSPACE/.soda-secret-amd64/lib\"" wine-tkg.cfg
          sed -i "\$a_configure_userargs32=\"--disable-wineopenxr SECRET_CFLAGS=-I$GITHUB_WORKSPACE/.soda-secret-i386/include SECRET_LIBS=-L$GITHUB_WORKSPACE/.soda-secret-i386/lib\"" wine-tkg.cfg
          if [[ "${{ steps.identity.outputs.pgo }}" == "true" ]]; then
            mkdir -p /tmp/soda-pgo/profiles /tmp/soda-pgo/evidence
            sed -i '$a_GCC_FLAGS="-O2 -pipe -msse3 -mfpmath=sse -ftree-vectorize -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -fprofile-generate=/tmp/soda-pgo/profiles -fprofile-update=prefer-atomic -fprofile-exclude-files=preloader"' wine-tkg.cfg
            sed -i '$a_LD_FLAGS="-Wl,-O1,--sort-common,--as-needed -fprofile-generate=/tmp/soda-pgo/profiles"' wine-tkg.cfg
          fi
          printf '%s\n' '_pkg_strip="false"' \
            '_GCC_FLAGS="${_GCC_FLAGS} -g -ffile-prefix-map=${_where}=/usr/src/soda/tkg"' \
            '_CROSS_FLAGS="${_CROSS_FLAGS} -g -ffile-prefix-map=${_where}=/usr/src/soda/tkg"' >> wine-tkg.cfg
          cat wine-tkg.cfg

      - name: build PGO training programs
        if: steps.identity.outputs.pgo == 'true'
        run: |
          x86_64-w64-mingw32-gcc .github/soda-pgo-training.c \
            -O2 -municode -ladvapi32 -lgdi32 -o /tmp/soda-pgo/training64.exe
          i686-w64-mingw32-gcc .github/soda-pgo-training.c \
            -O2 -municode -ladvapi32 -lgdi32 -o /tmp/soda-pgo/training32.exe

      - name: build ICU smoke programs
        run: |
          mkdir -p /tmp/soda-icu
          x86_64-w64-mingw32-gcc .github/soda-icu-smoke.c \
            -O2 -Wall -Wextra -Werror -o /tmp/soda-icu/smoke64.exe
          i686-w64-mingw32-gcc .github/soda-icu-smoke.c \
            -O2 -Wall -Wextra -Werror -o /tmp/soda-icu/smoke32.exe
      
      - name: start build
        id: compile
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yes|./non-makepkg-build.sh

      - name: verify packaged Unix runtime
        timeout-minutes: 5
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          for arch in i386 x86_64; do
            unix_dir="$runner_dir/lib/wine/$arch-unix"
            test -f "$unix_dir/ntdll.so"
            test -f "$unix_dir/win32u.so"
            test -f "$unix_dir/winebus.so"
            test -f "$unix_dir/winevulkan.so"
            test -f "$unix_dir/winex11.so"
            if ! grep -aFq 'org.winehq.Soda.Identity' "$unix_dir/windows.security.authentication.onlineid.so"; then
              printf 'Missing %s identity credential backend\n' "$arch" >&2
              exit 1
            fi
            module_count="$(find "$unix_dir" -maxdepth 1 -type f -name '*.so' | wc -l)"
            test "$module_count" -ge 30
            printf '%s Unix modules: %s\n' "$arch" "$module_count"
          done

      - name: train PGO build
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || env.PGO_BASELINE_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          test -n "$BASELINE_RUN_ID"
          export SODA_RUNNER_DIR="$PWD/$runner_dir"
          mkdir -p /tmp/soda-pgo/training-baseline /tmp/soda-pgo/training-baseline-extracted
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/soda-pgo/training-baseline
          baseline_archive="$(find /tmp/soda-pgo/training-baseline -type f \
            -name 'soda-*-x86_64.tar.xz' -print -quit)"
          test -n "$baseline_archive"
          tar -C /tmp/soda-pgo/training-baseline-extracted -xJf "$baseline_archive"
          baseline_runner="$(find /tmp/soda-pgo/training-baseline-extracted \
            -mindepth 1 -maxdepth 1 -type d -name 'soda-*-x86_64' -print -quit)"
          test -n "$baseline_runner"
          export BASELINE_RUNNER="$baseline_runner"

          printf 'Preparing PGO win64 prefix with baseline runner\n'
          timeout 5m xvfb-run -a bash -c '
            export WINEDEBUG=-all
            export WINEPREFIX=/tmp/soda-pgo/prefix64
            export WINEARCH=win64
            mkdir -p "$WINEPREFIX"
            "$BASELINE_RUNNER/bin/wineboot" -u
            "$BASELINE_RUNNER/bin/wineserver" -w
          '
          printf 'Training PGO win64 runner\n'
          timeout 10m xvfb-run -a bash -c '
            export WINEDEBUG=-all
            export WINEPREFIX=/tmp/soda-pgo/prefix64
            export WINEARCH=win64
            "$SODA_RUNNER_DIR/bin/wine" reg add "HKCU\Software\SodaPGO" /v Architecture /d win64 /f
            "$SODA_RUNNER_DIR/bin/wine" cmd /c ver
            "$SODA_RUNNER_DIR/bin/wine" /tmp/soda-pgo/training64.exe
            wineserver_status=0
            "$SODA_RUNNER_DIR/bin/wineserver" -w || wineserver_status=$?
            test "$wineserver_status" -le 1
          '
          printf 'Preparing PGO win32 prefix with baseline runner\n'
          timeout 5m xvfb-run -a bash -c '
            export WINEDEBUG=-all
            export WINEPREFIX=/tmp/soda-pgo/prefix32
            export WINEARCH=win32
            mkdir -p "$WINEPREFIX"
            "$BASELINE_RUNNER/bin/wineboot" -u
            "$BASELINE_RUNNER/bin/wineserver" -w
          '
          printf 'Training PGO win32 runner\n'
          timeout 10m xvfb-run -a bash -c '
            export WINEDEBUG=-all
            export WINEPREFIX=/tmp/soda-pgo/prefix32
            export WINEARCH=win32
            "$SODA_RUNNER_DIR/bin/wine" reg add "HKCU\Software\SodaPGO" /v Architecture /d win32 /f
            "$SODA_RUNNER_DIR/bin/wine" cmd /c ver
            "$SODA_RUNNER_DIR/bin/wine" /tmp/soda-pgo/training32.exe
            wineserver_status=0
            "$SODA_RUNNER_DIR/bin/wineserver" -w || wineserver_status=$?
            test "$wineserver_status" -le 1
          '
          find /tmp/soda-pgo/profiles -type f -name '*conftest*.gcda' \
            -print -delete | sort \
            > /tmp/soda-pgo/evidence/excluded-configure-profiles.txt
          test -s /tmp/soda-pgo/evidence/excluded-configure-profiles.txt
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' -size +0c \
            -printf '%s %p\n' | sort > /tmp/soda-pgo/evidence/profile-inventory.txt
          profile_count="$(wc -l < /tmp/soda-pgo/evidence/profile-inventory.txt)"
          test "$profile_count" -gt 0
          grep -E '[#/]+server[#/]+' /tmp/soda-pgo/evidence/profile-inventory.txt
          first_profile="$(find /tmp/soda-pgo/profiles -type f -name '*.gcda' -size +0c -print -quit)"
          gcov-dump -l "$first_profile" > /tmp/soda-pgo/evidence/profile-dump.txt
          grep -Eq 'runs=[1-9]|sum_max=[1-9]' /tmp/soda-pgo/evidence/profile-dump.txt

      - name: rebuild with PGO profiles
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          build_root=/home/runner/work/wine-tkg-git
          test "$PWD" = /home/runner/work
          test -f "$build_root/wine-tkg-git/non-makepkg-build.sh"
          find "$build_root" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git clone https://github.com/Frogging-Family/wine-tkg-git.git
          cd wine-tkg-git/wine-tkg-git
          git checkout "$WINE_TKG_COMMIT"
          sed -i "s/_LOCAL_PRESET=\"\"/_LOCAL_PRESET=\"valve-exp-bleeding\"/g" customization.cfg
          sed -i "s|^_bleeding_tag=.*|_bleeding_tag=\"$VALVE_WINE_TAG\"|" wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          sed -i '/^ubuntu_pkgs_64=/ s/libgstreamer-plugins-base1.0-dev/libgstreamer-plugins-base1.0-dev:amd64/' wine-tkg-scripts/deps
          cp "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch wine-tkg-userpatches/
          sed -i '/      _source_cleanup/a\      "$GITHUB_WORKSPACE/.github/import-msicu.sh" "${srcdir}/${_winesrcdir}"\n      "$GITHUB_WORKSPACE/.github/import-wineopenxr.sh" "${srcdir}/${_winesrcdir}" "/tmp/proton/wineopenxr"' non-makepkg-build.sh
          recipe=/home/runner/.config/frogminer/wine-tkg.cfg
          sed -i '/^_GCC_FLAGS=/d; /^_LD_FLAGS=/d' "$recipe"
          sed -i '$a_GCC_FLAGS="-O2 -g -ffile-prefix-map=${_where}=/usr/src/soda/tkg -pipe -msse3 -mfpmath=sse -ftree-vectorize -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-missing-profile -fprofile-use=/tmp/soda-pgo/profiles -fprofile-correction -fprofile-partial-training -fprofile-exclude-files=preloader"' "$recipe"
          sed -i '$a_LD_FLAGS="-Wl,-O1,--sort-common,--as-needed -fprofile-use=/tmp/soda-pgo/profiles"' "$recipe"
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' -exec touch -a -d @1 {} +
          touch /tmp/soda-pgo/profile-use-start
          set +o pipefail
          yes | ./non-makepkg-build.sh 2>&1 | tee /tmp/soda-pgo/evidence/profile-use-build.log
          build_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$build_status" -eq 0
          find /tmp/soda-pgo/profiles -type f -name '*.gcda' \
            -anewer /tmp/soda-pgo/profile-use-start -printf '%p\n' \
            > /tmp/soda-pgo/evidence/consumed-profiles.txt
          consumed_count="$(wc -l < /tmp/soda-pgo/evidence/consumed-profiles.txt)"
          test "$consumed_count" -gt 0
          grep -E '[#/]+server[#/]+' /tmp/soda-pgo/evidence/consumed-profiles.txt

      - name: verify packaged PGO Unix runtime
        timeout-minutes: 5
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          for arch in i386 x86_64; do
            unix_dir="$runner_dir/lib/wine/$arch-unix"
            test -f "$unix_dir/ntdll.so"
            test -f "$unix_dir/win32u.so"
            test -f "$unix_dir/winebus.so"
            test -f "$unix_dir/winevulkan.so"
            test -f "$unix_dir/winex11.so"
            if ! grep -aFq 'org.winehq.Soda.Identity' "$unix_dir/windows.security.authentication.onlineid.so"; then
              printf 'Missing %s identity credential backend\n' "$arch" >&2
              exit 1
            fi
            module_count="$(find "$unix_dir" -maxdepth 1 -type f -name '*.so' | wc -l)"
            test "$module_count" -ge 30
            printf '%s PGO Unix modules: %s\n' "$arch" "$module_count"
          done

