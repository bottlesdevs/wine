      - name: verify Office WinRT classes
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 5
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        run: |
          runner_dir="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          for arch in i386 x86_64; do
            test -f "$runner_dir/lib/wine/$arch-windows/windows.applicationmodel.dll"
            test -f "$runner_dir/lib/wine/$arch-windows/windows.networking.dll"
            test -f "$runner_dir/lib/wine/$arch-windows/windows.security.enterprisedata.dll"
            test -f "$runner_dir/lib/wine/$arch-windows/windows.security.authentication.onlineid.dll"
            test -f "$runner_dir/lib/wine/$arch-windows/twinapi.appcore.dll"
            test -f "$runner_dir/lib/wine/$arch-unix/windows.security.authentication.onlineid.so"
            grep -aFq 'org.winehq.Soda.Identity' "$runner_dir/lib/wine/$arch-unix/windows.security.authentication.onlineid.so"
          done

          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-office-winrt-smoke.c" \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt-smoke64.exe"
          i686-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-office-winrt-smoke.c" \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt-smoke32.exe"
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-ldap-smoke.c" \
            -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/soda-ldap-smoke64.exe"
          i686-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-ldap-smoke.c" \
            -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/soda-ldap-smoke32.exe"

          run_smoke() {
            local arch="$1"
            local executable="$2"
            local ldap_executable="$3"
            local log="$RUNNER_TEMP/soda-office-winrt-$arch.log"
            export WINEDEBUG=-all
            export WINEPREFIX="$RUNNER_TEMP/soda-office-winrt-prefix-$arch"
            export WINEARCH="$arch"
            mkdir -p "$WINEPREFIX"
            "$runner_dir/bin/wineboot" -u
            "$runner_dir/bin/wine" "$executable" | tr -d '\r' | tee "$log"
            grep -Fx 'core_application:00000000' "$log"
            grep -Fx 'message_websocket:00000000' "$log"
            grep -Fx 'protection_policy:00000000' "$log"
            grep -Fx 'retail_info:00000000' "$log"
            grep -Fx 'web_authentication_manager:00000000' "$log"
            grep -Fx 'composition_effect_source_parameter:00000000' "$log"
            "$runner_dir/bin/wine" reg add \
              "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\\$(basename "$ldap_executable")" \
              /v GlobalFlag /t REG_DWORD /d 112 /f
            "$runner_dir/bin/wine" "$ldap_executable" \
              | tr -d '\r' | tee "$log.ldap"
            grep -Fx 'ldap_init_checks:1024 failures:0' "$log.ldap"
            "$runner_dir/bin/wineserver" -w
          }

          run_smoke win64 "$RUNNER_TEMP/soda-office-winrt-smoke64.exe" "$RUNNER_TEMP/soda-ldap-smoke64.exe"
          run_smoke win32 "$RUNNER_TEMP/soda-office-winrt-smoke32.exe" "$RUNNER_TEMP/soda-ldap-smoke32.exe"

