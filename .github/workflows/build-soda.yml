      - name: benchmark PGO candidate
        if: steps.identity.outputs.pgo == 'true'
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || env.PGO_BASELINE_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$BASELINE_RUN_ID"
          pgo_runner="$(find non-makepkg-builds -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$pgo_runner"
          pgo_runner="$PWD/$pgo_runner"
          mkdir -p /tmp/soda-pgo/baseline /tmp/soda-pgo/baseline-extracted
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/soda-pgo/baseline
          baseline_archive="$(find /tmp/soda-pgo/baseline -type f -name 'soda-*-x86_64.tar.xz' -print -quit)"
          test -n "$baseline_archive"
          tar -C /tmp/soda-pgo/baseline-extracted -xJf "$baseline_archive"
          baseline_runner="$(find /tmp/soda-pgo/baseline-extracted -mindepth 1 -maxdepth 1 -type d -name 'soda-*-x86_64' -print -quit)"
          test -n "$baseline_runner"

          export WINEDEBUG=-all
          export WINEARCH=win64
          Xvfb :99 -screen 0 1024x768x24 >/tmp/soda-pgo/evidence/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          mkdir -p /tmp/soda-pgo/benchmark-baseline /tmp/soda-pgo/benchmark-pgo
          WINEPREFIX=/tmp/soda-pgo/benchmark-baseline "$baseline_runner/bin/wineboot" -u
          WINEPREFIX=/tmp/soda-pgo/benchmark-pgo "$pgo_runner/bin/wineboot" -u

          measure() {
            local label="$1"
            local runner="$2"
            local prefix="$3"
            local sample
            sample="$(WINEPREFIX="$prefix" "$runner/bin/wine" \
              /tmp/soda-pgo/training64.exe --benchmark | tr -d '\r' | \
              sed -n '/^[0-9][0-9]*$/p' | tail -1)"
            test -n "$sample"
            printf '%s\n' "$sample" >> "/tmp/soda-pgo/evidence/$label-samples.txt"
          }

          for trial in {1..9}; do
            if ((trial % 2)); then
              measure baseline "$baseline_runner" /tmp/soda-pgo/benchmark-baseline
              measure pgo "$pgo_runner" /tmp/soda-pgo/benchmark-pgo
            else
              measure pgo "$pgo_runner" /tmp/soda-pgo/benchmark-pgo
              measure baseline "$baseline_runner" /tmp/soda-pgo/benchmark-baseline
            fi
          done
          WINEPREFIX=/tmp/soda-pgo/benchmark-baseline "$baseline_runner/bin/wineserver" -w
          WINEPREFIX=/tmp/soda-pgo/benchmark-pgo "$pgo_runner/bin/wineserver" -w

          baseline_median="$(sort -n /tmp/soda-pgo/evidence/baseline-samples.txt | sed -n '5p')"
          pgo_median="$(sort -n /tmp/soda-pgo/evidence/pgo-samples.txt | sed -n '5p')"
          median_change="$(awk -v baseline="$baseline_median" -v pgo="$pgo_median" \
            'BEGIN { printf "%.2f", (pgo - baseline) * 100 / baseline }')"
          paste /tmp/soda-pgo/evidence/baseline-samples.txt \
            /tmp/soda-pgo/evidence/pgo-samples.txt \
            | awk '{ printf "%.6f\n", ($2 - $1) * 100 / $1 }' \
            | sort -n > /tmp/soda-pgo/evidence/paired-change-samples.txt
          paired_change_median="$(sed -n '5p' /tmp/soda-pgo/evidence/paired-change-samples.txt)"
          printf 'baseline_median_us=%s\npgo_median_us=%s\nmedian_change_percent=%s\npaired_change_median_percent=%s\n' \
            "$baseline_median" "$pgo_median" "$median_change" "$paired_change_median" \
            > /tmp/soda-pgo/evidence/benchmark.txt
          printf 'PGO benchmark: baseline %s us, candidate %s us, median change %s%%, paired change %s%%\n' \
            "$baseline_median" "$pgo_median" "$median_change" "$paired_change_median" \
            >> "$GITHUB_STEP_SUMMARY"
          awk -v median="$median_change" -v paired="$paired_change_median" \
            'BEGIN { exit !(median <= 2 && paired <= 5) }'
        
      - name: Upload prepare.log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /home/runner/work/wine-tkg-git/wine-tkg-git/prepare.log
            /home/runner/work/wine-tkg-git/wine-tkg-git/src/*-build/config.log
            /tmp/soda-pgo/evidence
            /tmp/soda-*.log
            /tmp/soda-openxr/*.log
          if-no-files-found: ignore

      - name: package
        timeout-minutes: 30
        working-directory: /home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="$(find . -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          test -f "$runner_dir/lib/wine/x86_64-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-unix/winegstreamer.so"
          test -f "$runner_dir/lib/wine/i386-windows/winegstreamer.dll"
          test -f "$runner_dir/lib/wine/x86_64-unix/winscard.so"
          test -f "$runner_dir/lib/wine/i386-unix/winscard.so"
          test -f "$runner_dir/lib/wine/x86_64-windows/winscard.dll"
          test -f "$runner_dir/lib/wine/i386-windows/winscard.dll"
          for arch in i386 x86_64; do
            test -f "$runner_dir/lib/wine/$arch-windows/windows.security.authentication.onlineid.dll"
            test -f "$runner_dir/lib/wine/$arch-windows/twinapi.appcore.dll"
            test -f "$runner_dir/lib/wine/$arch-unix/windows.security.authentication.onlineid.so"
          done
          test -x "$runner_dir/bin/wine"
          file "$runner_dir/bin/wine" | grep -F 'x86-64'
          file "$runner_dir/lib/wine/x86_64-windows/ntdll.dll" | grep -F 'x86-64'
          file "$runner_dir/lib/wine/i386-windows/ntdll.dll" | grep -F 'Intel 80386'
          test -f "$runner_dir/lib/wine/x86_64-windows/wineopenxr.dll"
          test -f "$runner_dir/lib/wine/x86_64-unix/wineopenxr.so"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          PATH="/usr/lib/llvm-22/bin:$PATH" xvfb-run -a sh "$GITHUB_WORKSPACE/.github/build-eagle.sh" "$runner_dir" "$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sh "$GITHUB_WORKSPACE/.github/soda-provenance.sh" "$runner_dir" \
            "$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-package-provenance" \
            --name "$COMPONENT_NAME" --refresh --assembly-source "$GITHUB_WORKSPACE"
          symbols_root="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-symbols"
          python3 -S "$GITHUB_WORKSPACE/.github/soda-symbols.py" "$runner_dir" "$symbols_root/$COMPONENT_NAME" \
            --tools "$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-package-provenance/native" --verify
          cp "$runner_dir/share/soda/"{build,files,sources}.json "$symbols_root/$COMPONENT_NAME/share/soda/"
          tar -C "$symbols_root" -cJf "/tmp/$COMPONENT_NAME-symbols.tar.xz" "$COMPONENT_NAME"
          mv "$runner_dir" "$COMPONENT_NAME"
          tar cJvf "$ARCHIVE_NAME" "$COMPONENT_NAME"
          mv "$ARCHIVE_NAME" "/tmp/$ARCHIVE_NAME"

      - name: upload Eagle test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eagle-test-logs-${{ github.sha }}
          path: |
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/p32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/p64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/c32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/c64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/s32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/s64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/i32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/i64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j32/s*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j32/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j64/s*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/j64/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k32/*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k32/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k64/*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/k64/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l32/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l32/*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l32/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l64/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l64/*/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/l64/*/session/*.json*
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/d/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/t/*.log
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}/tests/e/*.log
          if-no-files-found: ignore

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: |
            /tmp/${{ steps.identity.outputs.archive_name }}
            /tmp/${{ steps.identity.outputs.component_name }}-symbols.tar.xz
          if-no-files-found: error

      - name: upload PGO evidence
        if: steps.identity.outputs.pgo == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pgo-evidence-${{ github.sha }}
          path: /tmp/soda-pgo/evidence/*.txt
          if-no-files-found: error

      - name: verify application registry hives
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 10
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/home/runner/work/wine-tkg-git/wine-tkg-git/non-makepkg-builds/$COMPONENT_NAME"
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-registry"
          mkdir -p "$work/source"
          echo "REGISTRY_WORK=$work" >> "$GITHUB_ENV"
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          export WINEPREFIX="$work/prefix" WINEARCH=win64 WINEDEBUG=-all
          export WINEDLLOVERRIDES='mscoree,mshtml,winedbg.exe='
          trap '"$runner_dir/bin/wineserver" -k || true; "$runner_dir/bin/wineserver" -w || true' EXIT
          git -C "$work/source" apply --include=server/registry_hive.c --include=server/registry_hive.h \
            "$GITHUB_WORKSPACE/wine-tkg-userpatches/registry-hive-codec.mypatch"
          env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" wineboot -u > "$work/wineboot.log" 2>&1
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then compiler=x86_64-w64-mingw32-gcc; else compiler=i686-w64-mingw32-gcc; fi
            mkdir "$work/fixtures$bits"
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-registry-app-hive.c" \
              "$work/source/server/registry_hive.c" -I"$work/source/server" -DREGISTRY_HIVE_CODEC \
              -municode -O2 -Wall -Wextra -Werror -ladvapi32 -o "$work/registry$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/registry$bits.exe" \
              "$work/fixtures$bits" "$work/registry$bits.dat" > "$work/registry$bits.jsonl" 2> "$work/registry$bits.stderr"
            python3 - "$work" "$bits" <<'PYCODE'
          import json
          from pathlib import Path
          import sys
          work, bits = Path(sys.argv[1]), sys.argv[2]
          records = [json.loads(line) for line in (work / f'registry{bits}.jsonl').read_text().splitlines()]
          assert records and records[-1] == {'checks': 230, 'failures': 0}, records[-1:] or 'No SDK output'
          assert all(row['result'] == row['expected'] for row in records if 'expected' in row)
          assert not list((work / f'fixtures{bits}').iterdir()), 'Registry fixture files remain'
          print(f'Registry {bits}-bit:230checks pass')
          PYCODE
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-crypt32-oid.c" \
              -O2 -Wall -Wextra -Werror -lcrypt32 -o "$work/oid$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/oid$bits.exe" \
              | tr -d '\r' | tee "$work/oid$bits.log"
            grep -Fx 'OID metadata: 31 checks, 0 failures' "$work/oid$bits.log"
            "$compiler" "$GITHUB_WORKSPACE/eagle/tests/export.c" \
              -shared -s -O2 -Wall -Wextra -Werror -o "$work/export-fixture$bits.dll"
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-dbghelp-exports.c" \
              -O2 -Wall -Wextra -Werror -ldbghelp -o "$work/exports$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/exports$bits.exe" \
              "export-fixture$bits.dll" | tr -d '\r' | tee "$work/exports$bits.log"
            grep -Fx 'failures=0' "$work/exports$bits.log"
          done

      - uses: actions/upload-artifact@v7
        if: always() && env.REGISTRY_WORK != ''
        with:
          name: registry-runtime-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ env.REGISTRY_WORK }}/registry64.jsonl
            ${{ env.REGISTRY_WORK }}/registry32.jsonl
            ${{ env.REGISTRY_WORK }}/registry64.stderr
            ${{ env.REGISTRY_WORK }}/registry32.stderr
            ${{ env.REGISTRY_WORK }}/registry64.exe
            ${{ env.REGISTRY_WORK }}/registry32.exe
            ${{ env.REGISTRY_WORK }}/wineboot.log
            ${{ env.REGISTRY_WORK }}/oid64.log
            ${{ env.REGISTRY_WORK }}/oid32.log
            ${{ env.REGISTRY_WORK }}/exports64.log
            ${{ env.REGISTRY_WORK }}/exports32.log
          if-no-files-found: error
          retention-days: 7

      - name: compiler cache statistics
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        run: ccache --show-stats

      - name: save compiler cache
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  compiler-cache:
    needs: patches
    if: inputs.architecture == 'compiler-cache' && inputs.winrt_http_reference != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CCACHE_DIR: /home/runner/.cache/soda-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7

      - name: restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-

      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache gcc clang gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          mkdir -p "$CCACHE_DIR"

      - name: check compiler cache
        id: compile
        run: |
          for compiler in gcc clang x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc; do
            bash .github/soda-compiler-cache-smoke.sh "$RUNNER_TEMP/cache-smoke/$compiler" "$compiler" \
              | tee "$RUNNER_TEMP/cache-smoke-$compiler.log"
          done

      - name: check ARM SDK compiler cache
        if: runner.arch == 'ARM64'
        run: |
          sudo systemctl start docker
          docker build --file .github/soda-arm64-sdk.Dockerfile --tag soda-arm64-sdk .github
          work="$RUNNER_TEMP/cache-proton"
          mkdir -p "$work/source" "$work/build"
          for file in configure.sh Makefile.in; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/ValveSoftware/Proton/$PROTON_COMMIT/$file" \
              --output "$work/source/$file"
          done
          (
            cd "$work/build"
            bash "$work/source/configure.sh" --build-name=cache-check --target-arch=arm64 \
              --container-engine=docker --proton-sdk-image=soda-arm64-sdk --enable-ccache
            grep -Fx 'ENABLE_CCACHE := 1' Makefile
            make --no-print-directory -n --eval='cache-options:;@echo $(DOCKER_OPTS)' cache-options \
              | tee "$RUNNER_TEMP/cache-proton-options.log"
          )
          grep -F -- "-v $CCACHE_DIR:$CCACHE_DIR" "$RUNNER_TEMP/cache-proton-options.log"
          grep -F -- '-e CCACHE_COMPILERCHECK' "$RUNNER_TEMP/cache-proton-options.log"
          if grep -F -- 'CCACHE_DISABLE=1' "$RUNNER_TEMP/cache-proton-options.log"; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/cache-sdk"
          for target in native x86_64-windows-gnu i686-windows-gnu; do
            flags=()
            if [[ "$target" != native ]]; then flags=("--target=$target"); fi
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$CCACHE_DIR:$CCACHE_DIR" -e CCACHE_DIR -e CCACHE_COMPILERCHECK -e CCACHE_MAXSIZE \
              -e CCACHE_SMOKE_DIRECT=1 \
              -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/cache-sdk:/work" \
              soda-arm64-sdk bash /source/.github/soda-compiler-cache-smoke.sh \
              "/work/$target" clang "${flags[@]}" | tee -a "$RUNNER_TEMP/cache-sdk.log"
          done

      - name: compiler cache statistics
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        run: ccache --show-stats

      - name: save compiler cache
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-cache-${{ runner.arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cache-smoke-*.log
            ${{ runner.temp }}/cache-sdk.log
            ${{ runner.temp }}/cache-proton-options.log
          if-no-files-found: error
          retention-days: 7

  arm64-control:
    needs: patches
    if: inputs.architecture == 'aarch64-control' && inputs.winrt_http_reference != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: prepare existing ARM candidate
        run: |
          test "$(uname -m)" = aarch64
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-control"
          mkdir -p "$work/downloads" "$work/runner"
          echo "CPL_WORK=$work" >> "$GITHUB_ENV"
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$work/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > "$work/source-artifacts.json"
          name="$(jq -er '[.artifacts[] | select(.expired == false and (.name | endswith("-aarch64")))] | if length == 1 then .[0].name else error("expected one ARM candidate") end' "$work/source-artifacts.json")"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$work/downloads"
          archive="$(find "$work/downloads" -maxdepth 1 -type f -name '*-aarch64.tar.xz' -print -quit)"
          test -n "$archive"
          sha256sum "$archive" > "$work/candidate.sha256"
          tar -xJf "$archive" -C "$work/runner"
          runner_dir="$(find "$work/runner" -mindepth 1 -maxdepth 1 -type d -name 'soda-*-aarch64' -print -quit)"
          test -x "$runner_dir/bin/wine"
          echo "CPL_RUNNER=$runner_dir" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 xvfb xauth

      - name: inspect Control Panel hosting
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        run: |
          export TMPDIR="$CPL_WORK" TMP="$CPL_WORK" TEMP="$CPL_WORK"
          export WINEPREFIX="$CPL_WORK/prefix" WINEARCH=win64
          export FEX_APP_CONFIG="$CPL_RUNNER/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$CPL_RUNNER/share/fex-emu"
          export WINEDLLOVERRIDES='mscoree,mshtml,winedbg.exe='
          export WINEDEBUG=-all,+module,+process
          ldd "$CPL_RUNNER/bin/wine" > "$CPL_WORK/ldd.log"
          "$CPL_RUNNER/bin/wine" wineboot -u > "$CPL_WORK/wineboot.stdout" 2> "$CPL_WORK/wineboot.stderr"
          trap '"$CPL_RUNNER/bin/wineserver" -k; "$CPL_RUNNER/bin/wineserver" -w' EXIT
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then compiler=x86_64-w64-mingw32-gcc; else compiler=i686-w64-mingw32-gcc; fi
            directory="$CPL_WORK/cpl-$bits"
            fixture="$directory/fixtures, with space/applet.cpl"
            mkdir -p "$(dirname "$fixture")" "$directory/results"
            "$compiler" .github/soda-control-host-smoke.c -DBUILD_CPL -shared -Wl,--kill-at \
              -O2 -Wall -Wextra -Werror -o "$fixture"
            "$compiler" .github/soda-control-host-smoke.c -municode \
              -O2 -Wall -Wextra -Werror -o "$directory/client.exe"
            set +e
            "$CPL_RUNNER/bin/wine" "$directory/client.exe" "Z:$fixture" "Z:$directory/results" \
              > "$directory/client.stdout" 2> "$directory/client.stderr"
            result=$?
            set -e
            printf '%s\n' "$result" > "$directory/exit-code"
            cat "$directory/client.stdout"
          done

      - uses: actions/upload-artifact@v7
        if: always() && env.CPL_WORK != ''
        with:
          name: arm64-control-${{ github.sha }}
          path: |
            ${{ env.CPL_WORK }}/*.json
            ${{ env.CPL_WORK }}/*.log
            ${{ env.CPL_WORK }}/*.sha256
            ${{ env.CPL_WORK }}/*.stdout
            ${{ env.CPL_WORK }}/*.stderr
            ${{ env.CPL_WORK }}/cpl-*/*.stdout
            ${{ env.CPL_WORK }}/cpl-*/*.stderr
            ${{ env.CPL_WORK }}/cpl-*/exit-code
          if-no-files-found: error
          retention-days: 7

  arm64:
    needs: patches
    if: inputs.winrt_http_reference != true && (github.event_name == 'push' || inputs.architecture == 'aarch64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      CCACHE_DIR: /home/runner/.cache/soda-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    outputs:
      archive_name: ${{ steps.identity.outputs.archive_name }}
      component_name: ${{ steps.identity.outputs.component_name }}

    steps:
      - uses: actions/checkout@v7

      - name: restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/soda-arm64-sdk.Dockerfile') }}-

      - name: define build identity
        id: identity
        run: |
          version="$WINE_VERSION-$REVISION"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/soda" ]]; then
            version="$version-${GITHUB_SHA::7}"
          fi
          component_name="soda-$version-aarch64"
          echo "archive_name=$component_name.tar.xz" >> "$GITHUB_OUTPUT"
          echo "component_name=$component_name" >> "$GITHUB_OUTPUT"

      - name: setup
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libjson-c-dev \
            libsqlite3-dev \
            libglib2.0-dev \
            g++ \
            ccache \
            file \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            xvfb \
            xz-utils
          command -v docker
          sudo systemctl start docker
          docker version

      - name: initialize compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --version
          ccache --show-config

      - name: prepare sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /tmp/proton
          git -C /tmp/proton checkout "$PROTON_COMMIT"
          test "$(git -C /tmp/proton rev-parse HEAD)" = "$PROTON_COMMIT"
          git -C /tmp/proton submodule update --init --recursive wine OpenXR-SDK FEX
          test "$(git -C /tmp/proton/FEX rev-parse HEAD)" = "$FEX_COMMIT"
          test "$(git -C /tmp/proton/OpenXR-SDK rev-parse HEAD)" = "$OPENXR_SDK_COMMIT"
          git -C /tmp/proton/wine fetch --no-tags origin "$VALVE_WINE_TAG"
          git -C /tmp/proton/wine checkout --detach "$VALVE_WINE_COMMIT"
          test "$(git -C /tmp/proton/wine rev-parse HEAD)" = "$VALVE_WINE_COMMIT"
          .github/import-msicu.sh /tmp/proton/wine
          for patch in "$GITHUB_WORKSPACE"/wine-tkg-userpatches/*.mypatch; do
            if [[ "$patch" == *wineopenxr-host-runtime.mypatch || "$patch" == *wineopenxr-long-types.mypatch ]]; then
              continue
            fi
            git -C /tmp/proton/wine apply --check "$patch"
            git -C /tmp/proton/wine apply "$patch"
          done
          git -C /tmp/proton/wineopenxr apply --check "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"
          git -C /tmp/proton/wineopenxr apply "$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch"

      - name: build ICU and Office smoke programs
        run: |
          mkdir -p /tmp/soda-icu
          x86_64-w64-mingw32-gcc .github/soda-icu-smoke.c \
            -O2 -Wall -Wextra -Werror -o /tmp/soda-icu/smoke64.exe
          i686-w64-mingw32-gcc .github/soda-icu-smoke.c \
            -O2 -Wall -Wextra -Werror -o /tmp/soda-icu/smoke32.exe
          mkdir -p "$RUNNER_TEMP/soda-office-winrt"
          x86_64-w64-mingw32-gcc .github/soda-office-winrt-smoke.c \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt/smoke64.exe"
          i686-w64-mingw32-gcc .github/soda-office-winrt-smoke.c \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt/smoke32.exe"
          x86_64-w64-mingw32-gcc .github/soda-ldap-smoke.c \
            -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/soda-office-winrt/ldap64.exe"
          i686-w64-mingw32-gcc .github/soda-ldap-smoke.c \
            -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/soda-office-winrt/ldap32.exe"

      - name: prepare identity SDK
        run: |
          docker build --file .github/soda-arm64-sdk.Dockerfile --tag soda-arm64-sdk .github

      - name: configure
        run: |
          sed -i 's/^WINE_CFLAGS += -Wno-discarded-qualifiers$/& -gdwarf-4/' /tmp/proton/Makefile.in
          grep -Fx 'WINE_CFLAGS += -Wno-discarded-qualifiers -gdwarf-4' /tmp/proton/Makefile.in
          sed -i '/^$(eval $(call rules-autoconf,wine,aarch64,unix))$/i WINE_aarch64_AUTOCONF_ARGS += aarch64_LDFLAGS=-Wl,-debug:dwarf arm64ec_LDFLAGS=-Wl,-debug:dwarf i386_LDFLAGS=-Wl,-debug:dwarf x86_64_LDFLAGS=-Wl,-debug:dwarf' /tmp/proton/Makefile.in
          grep -Fx 'WINE_aarch64_AUTOCONF_ARGS += aarch64_LDFLAGS=-Wl,-debug:dwarf arm64ec_LDFLAGS=-Wl,-debug:dwarf i386_LDFLAGS=-Wl,-debug:dwarf x86_64_LDFLAGS=-Wl,-debug:dwarf' /tmp/proton/Makefile.in
          mkdir /tmp/proton-build
          cd /tmp/proton-build
          /tmp/proton/configure.sh --build-name=soda-arm64 --target-arch=arm64 \
            --container-engine=docker --proton-sdk-image=soda-arm64-sdk --enable-ccache

      - name: build Wine and FEX
        id: compile
        working-directory: /tmp/proton-build
        run: |
          make UNSTRIPPED_BUILD=1 WINE_DEPENDS= WINE_aarch64_DEPENDS= wine
          make UNSTRIPPED_BUILD=1 WINE_DEPENDS= WINE_aarch64_DEPENDS= fex
          make UNSTRIPPED_BUILD=1 WINE_DEPENDS= WINE_aarch64_DEPENDS= fex_unixlib
          make UNSTRIPPED_BUILD=1 WINE_DEPENDS= WINE_aarch64_DEPENDS= wineopenxr

      - name: package
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          proton_files=/tmp/proton-build/dist/files
          test -x "$proton_files/bin-arm64/wine"
          test -x "$proton_files/bin-arm64/wineserver"
          mkdir "$runner_dir"
          cp -a "$proton_files"/. "$runner_dir"/
          mv "$runner_dir/bin-arm64" "$runner_dir/bin"
          install -Dm644 /tmp/proton/FEX_Config.json "$runner_dir/share/fex-emu/Config.json"
          install -Dm644 /tmp/proton/wineopenxr/wineopenxr64.json "$runner_dir/share/openxr/wineopenxr64.json"
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          curl --fail --location --retry 3 --output "/tmp/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  /tmp/$mono_file" | sha256sum --check -
          install -Dm644 "/tmp/$mono_file" "$runner_dir/share/wine/mono/$mono_file"
          required_files=(
            lib/wine/aarch64-unix/ntdll.so
            lib/wine/aarch64-windows/ntdll.dll
            lib/wine/x86_64-windows/ntdll.dll
            lib/wine/i386-windows/icu.dll
            lib/wine/x86_64-windows/icu.dll
            lib/wine/aarch64-windows/icu.dll
            lib/wine/aarch64-windows/libarm64ecfex.dll
            lib/wine/aarch64-windows/libwow64fex.dll
            lib/wine/aarch64-unix/libarm64ecfex.so
            lib/wine/aarch64-unix/libwow64fex.so
            lib/wine/aarch64-windows/wineopenxr.dll
            lib/wine/x86_64-windows/wineopenxr.dll
            lib/wine/i386-windows/windows.security.authentication.onlineid.dll
            lib/wine/x86_64-windows/windows.security.authentication.onlineid.dll
            lib/wine/aarch64-windows/windows.security.authentication.onlineid.dll
            lib/wine/aarch64-unix/windows.security.authentication.onlineid.so
            lib/wine/i386-windows/twinapi.appcore.dll
            lib/wine/x86_64-windows/twinapi.appcore.dll
            lib/wine/aarch64-windows/twinapi.appcore.dll
          )
          for required_file in "${required_files[@]}"; do
            if ! test -f "$runner_dir/$required_file"; then
              echo "Missing required ARM64 runner file: $required_file" >&2
              exit 1
            fi
          done
          grep -aFq 'org.winehq.Soda.Identity' \
            "$runner_dir/lib/wine/aarch64-unix/windows.security.authentication.onlineid.so"
          file "$runner_dir/bin/wine" | grep -F 'ARM aarch64'
          if ldd "$runner_dir/bin/wine" | grep -F 'not found'; then
            exit 1
          fi
          eagle_work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-eagle"
          mkdir -p "$eagle_work"
          if ! sh "$GITHUB_WORKSPACE/.github/build-eagle-analyzer.sh" "$runner_dir" "$eagle_work" > "$eagle_work/build.log" 2>&1; then
            cat "$eagle_work/build.log"
            exit 1
          fi
          for helper in pe elf analysis intel driver yara; do
            file "$runner_dir/lib/eagle/native/eagle-$helper" | grep -F 'ARM aarch64'
          done
          sh "$GITHUB_WORKSPACE/.github/soda-provenance.sh" "$runner_dir" \
            "$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-provenance" \
            --name "$COMPONENT_NAME" \
            --source "recipe=$GITHUB_WORKSPACE" --expect-source "recipe=$GITHUB_SHA" \
            --source wine=/tmp/proton/wine --expect-source "wine=$VALVE_WINE_COMMIT" \
            --source proton=/tmp/proton --expect-source "proton=$PROTON_COMMIT" \
            --source openxr=/tmp/proton/OpenXR-SDK --expect-source "openxr=$OPENXR_SDK_COMMIT" \
            --source fex=/tmp/proton/FEX --expect-source "fex=$FEX_COMMIT" \
            --source wineopenxr=/tmp/proton/wineopenxr --expect-source "wineopenxr=$PROTON_COMMIT" \
            --patch-dir "$GITHUB_WORKSPACE/wine-tkg-userpatches" \
            --input "openxr_patch=$GITHUB_WORKSPACE/.github/wineopenxr-host-runtime-proton.mypatch" \
            --config-root /tmp/proton-build --assembly-source "$GITHUB_WORKSPACE"
          tools="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-provenance/native"
          symbols_root="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-symbols"
          python3 -S "$GITHUB_WORKSPACE/.github/soda-symbols.py" "$runner_dir" "$symbols_root/$COMPONENT_NAME" \
            --tools "$tools" --name "$COMPONENT_NAME" --debug-root /tmp/proton-build \
            --require bin/wine --require bin/wineserver \
            --require lib/wine/aarch64-unix/ntdll.so --require lib/wine/aarch64-windows/ntdll.dll \
            --require lib/wine/x86_64-windows/ntdll.dll
          python3 -S "$GITHUB_WORKSPACE/.github/soda-provenance.py" "$runner_dir" \
            --tools "$tools" --name "$COMPONENT_NAME" --refresh
          cp "$runner_dir/share/soda/"{build,files,sources}.json "$symbols_root/$COMPONENT_NAME/share/soda/"
          tar -C "$symbols_root" -cJf "/tmp/$COMPONENT_NAME-symbols.tar.xz" "$COMPONENT_NAME"
          tar -C /tmp -cJf "/tmp/$ARCHIVE_NAME" "$COMPONENT_NAME"

      - name: retain failed ARM package inputs
        if: failure()
        run: |
          if test -d /tmp/proton-build/dist/files; then
            work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64-inputs"
            mkdir -p "$work"
            tar -C /tmp/proton-build/dist -cf "$work/files.tar" files
          fi

      - name: upload failed ARM package inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-package-inputs-${{ github.sha }}
          path: /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}-arm64-inputs/files.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1

      - name: upload ARM Eagle build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eagle-arm64-build-${{ github.sha }}
          path: |
            /home/runner/artifacts/Soda-${{ github.run_id }}-${{ github.run_attempt }}-arm64-eagle/build.log
            /tmp/proton-build/obj-wine-aarch64/config.log
          if-no-files-found: ignore

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.component_name }}
          path: |
            /tmp/${{ steps.identity.outputs.archive_name }}
            /tmp/${{ steps.identity.outputs.component_name }}-symbols.tar.xz
          if-no-files-found: error

      - name: verify Windows architectures
        timeout-minutes: 10
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          set -o pipefail
          runner_dir="/tmp/$COMPONENT_NAME"
          export FEX_APP_CONFIG="$runner_dir/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$runner_dir/share/fex-emu"
          export WINEARCH=win64
          export WINEDEBUG=+module,+process
          export WINEPREFIX=/tmp/soda-arm64-prefix
          runtime_log=/tmp/soda-arm64-runtime.log
          mkdir -p "$WINEPREFIX"
          if ! "$runner_dir/bin/wine" wineboot -u >"$runtime_log" 2>&1; then
            cat "$runtime_log"
            exit 1
          fi
          if ! native_arch="$("$runner_dir/bin/wine" cmd /c echo '%PROCESSOR_ARCHITECTURE%' 2>>"$runtime_log" | tr -d '\r' | grep -E '^(ARM64|AMD64|x86)$' | tail -1)"; then
            cat "$runtime_log"
            exit 1
          fi
          if [[ "$native_arch" != ARM64 ]]; then
            printf 'Expected ARM64, got: %s\n' "$native_arch" >&2
            cat "$runtime_log"
            exit 1
          fi
          x64_cmd="$runner_dir/lib/wine/x86_64-windows/cmd.exe"
          test -f "$x64_cmd"
          if ! x64_arch="$("$runner_dir/bin/wine" "$x64_cmd" /c echo '%PROCESSOR_ARCHITECTURE%' 2>>"$runtime_log" | tr -d '\r' | grep -E '^(ARM64|AMD64|x86)$' | tail -1)"; then
            cat "$runtime_log"
            exit 1
          fi
          if [[ "$x64_arch" != AMD64 ]]; then
            printf 'Expected AMD64, got: %s\n' "$x64_arch" >&2
            cat "$runtime_log"
            exit 1
          fi
          x86_cmd="$runner_dir/lib/wine/i386-windows/cmd.exe"
          test -f "$x86_cmd"
          if ! x86_arch="$("$runner_dir/bin/wine" "$x86_cmd" /c echo '%PROCESSOR_ARCHITECTURE%' 2>>"$runtime_log" | tr -d '\r' | grep -E '^(ARM64|AMD64|x86)$' | tail -1)"; then
            cat "$runtime_log"
            exit 1
          fi
          if [[ "$x86_arch" != x86 ]]; then
            printf 'Expected x86, got: %s\n' "$x86_arch" >&2
            cat "$runtime_log"
            exit 1
          fi
          printf 'Windows architectures: native=%s, x64=%s, x86=%s\n' \
            "$native_arch" "$x64_arch" "$x86_arch" | tee -a "$GITHUB_STEP_SUMMARY"

          wine_headers=/tmp/proton-build/dst-wine-aarch64/include/wine/windows
          test -f "$wine_headers/windows.ui.composition.h"
          x86_64-w64-mingw32-gcc .github/soda-composition-brush-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt/brush64.exe"
          i686-w64-mingw32-gcc .github/soda-composition-brush-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
            -o "$RUNNER_TEMP/soda-office-winrt/brush32.exe"
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then compiler=x86_64-w64-mingw32-gcc; else compiler=i686-w64-mingw32-gcc; fi
            "$compiler" .github/soda-mapi-wizard-smoke.c \
              -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/soda-office-winrt/mapi-wizard$bits.exe"
            "$compiler" .github/soda-msi-components-smoke.c \
              -municode -O2 -Wall -Wextra -Werror -lmsi -ladvapi32 \
              -o "$RUNNER_TEMP/soda-office-winrt/msi-components$bits.exe"
            "$compiler" .github/soda-msi-feature-handles.c \
              -O2 -Wall -Wextra -Werror -lmsi -lntdll -ladvapi32 \
              -o "$RUNNER_TEMP/soda-office-winrt/msi-handles$bits.exe"
            "${compiler%gcc}g++" .github/soda-d2d-dashes-smoke.cpp \
              -O2 -Wall -Wextra -Werror -static-libgcc -static-libstdc++ \
              -ld2d1 -lwindowscodecs -lole32 -luuid \
              -o "$RUNNER_TEMP/soda-office-winrt/dashes$bits.exe"
            "${compiler%gcc}g++" .github/soda-d2d-scaled-dashes.cpp \
              -O2 -Wall -Wextra -Werror -static-libgcc -static-libstdc++ \
              -ld2d1 -lwindowscodecs -lole32 -luuid \
              -o "$RUNNER_TEMP/soda-office-winrt/scaled-dashes$bits.exe"
            "$compiler" .github/soda-http-media-reference.c \
              -O2 -Wall -Wextra -Werror -lruntimeobject \
              -o "$RUNNER_TEMP/soda-office-winrt/http-media$bits.exe"
            "$compiler" .github/soda-http-headers-smoke.c \
              -I"$wine_headers" -D__WINESRC__ \
              -municode -O2 -Wall -Wextra -Werror -lruntimeobject \
              -o "$RUNNER_TEMP/soda-office-winrt/http-headers$bits.exe"
            "$compiler" .github/soda-composition-inertia-smoke.c \
              -I"$wine_headers" -D__WINESRC__ \
              -O2 -Wall -Wextra -Werror -lole32 -lruntimeobject \
              -o "$RUNNER_TEMP/soda-office-winrt/inertia$bits.exe"
            control_dir="$RUNNER_TEMP/soda-office-winrt/control-$bits"
            fixture="$control_dir/fixtures, with space/applet.cpl"
            mkdir -p "$(dirname "$fixture")" "$control_dir/results"
            "$compiler" .github/soda-control-host-smoke.c \
              -DBUILD_CPL -shared -Wl,--kill-at -O2 -Wall -Wextra -Werror -o "$fixture"
            "$compiler" .github/soda-control-host-smoke.c \
              -municode -O2 -Wall -Wextra -Werror -o "$control_dir/client.exe"
            mapi_dir="$RUNNER_TEMP/soda-office-winrt/mapi-client$bits"
            mkdir -p "$mapi_dir"
            "$compiler" .github/soda-mapi-client-smoke.c \
              -O2 -Wall -Wextra -Werror -DBUILD_MAPI_PROVIDER -shared -Wl,--kill-at \
              -lole32 -luuid -o "$mapi_dir/OLMAPI32.DLL"
            "$compiler" .github/soda-mapi-client-smoke.c \
              -O2 -Wall -Wextra -Werror -DBUILD_MIME_PROVIDER -shared -Wl,--kill-at \
              -lole32 -luuid -o "$mapi_dir/OUTLMIME.DLL"
            "$compiler" .github/soda-mapi-client-smoke.c \
              -O2 -Wall -Wextra -Werror -lole32 -luuid -o "$mapi_dir/client.exe"
            for probe in surface callbacks graphics-device; do
              "$compiler" ".github/soda-composition-$probe-smoke.c" \
                -I"$wine_headers" -D__WINESRC__ \
                -O2 -Wall -Wextra -Wno-unused-parameter -Werror \
                -lole32 -lruntimeobject -ld3d11 -ld2d1 -ldxguid -luuid \
                -o "$RUNNER_TEMP/soda-office-winrt/composition-$probe$bits.exe"
            done
          done
          x86_64-w64-mingw32-gcc .github/soda-ink-host-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Wno-unused-parameter -Werror -lole32 -luuid \
            -o "$RUNNER_TEMP/soda-office-winrt/ink64.exe"
          i686-w64-mingw32-gcc .github/soda-ink-host-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Wno-unused-parameter -Werror -lole32 -luuid \
            -o "$RUNNER_TEMP/soda-office-winrt/ink32.exe"
          x86_64-w64-mingw32-gcc .github/soda-ink-values-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Wno-unused-parameter -Werror -lole32 -lruntimeobject -luuid \
            -o "$RUNNER_TEMP/soda-office-winrt/ink-values64.exe"
          i686-w64-mingw32-gcc .github/soda-ink-values-smoke.c \
            -I"$wine_headers" -D__WINESRC__ \
            -O2 -Wall -Wextra -Wno-unused-parameter -Werror -lole32 -lruntimeobject -luuid \
            -o "$RUNNER_TEMP/soda-office-winrt/ink-values32.exe"
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then compiler=x86_64-w64-mingw32-gcc; else compiler=i686-w64-mingw32-gcc; fi
            for probe in source input drying; do
              "$compiler" ".github/soda-ink-core-$probe.c" \
                -I"$wine_headers" -D__WINESRC__ \
                -O2 -Wall -Wextra -Wno-unused-parameter -Werror -lole32 -lruntimeobject -luuid \
                -o "$RUNNER_TEMP/soda-office-winrt/ink-core-$probe$bits.exe"
            done
          done
          export TZ=America/Denver
          export WINEDEBUG=-all
          "$runner_dir/bin/wine" /tmp/soda-icu/smoke64.exe \
            | tr -d '\r' | tee /tmp/soda-icu/runtime64.log
          grep -F 'ICU 72.1 timezone=America/Denver' /tmp/soda-icu/runtime64.log
          "$runner_dir/bin/wine" /tmp/soda-icu/smoke32.exe \
            | tr -d '\r' | tee /tmp/soda-icu/runtime32.log
          grep -F 'ICU 72.1 timezone=America/Denver' /tmp/soda-icu/runtime32.log
          http_dir="$HOME/artifacts/soda-http-headers-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$http_dir"
          printf fixture > "$http_dir/fixture"
          TMPDIR="$http_dir" TMP="$http_dir" TEMP="$http_dir" \
            python3 -m http.server 9284 --bind 127.0.0.1 --directory "$http_dir" > "$http_dir/server.log" 2>&1 &
          http_pid=$!
          trap 'kill "$http_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:9284/fixture
          for arch in 64 32; do
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/mapi-wizard$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/mapi-wizard$arch.log"
            grep -Fx 'MAPI_RUNTIME_RESULT failures=0' "$RUNNER_TEMP/soda-office-winrt/mapi-wizard$arch.log"
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/http-headers$arch.exe" http://127.0.0.1:9284/fixture \
              | tr -d '\r' | tee "$http_dir/headers$arch.log"
            grep -Fx 'HTTP_HEADER_ABI_RESULT checks=111 failures=0' "$http_dir/headers$arch.log"
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/http-media$arch.exe" > "$http_dir/media$arch.jsonl"
            python3 .github/soda-http-media-compare.py .github/soda-http-media-reference.jsonl "$http_dir/media$arch.jsonl"
            msi_dir="$RUNNER_TEMP/soda-office-winrt/msi-components-$arch"
            mkdir -p "$msi_dir/root/Integration" "$msi_dir/root/Office16"
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/msi-components$arch.exe" "Z:$msi_dir" \
              | tr -d '\r' | tee "$msi_dir/runtime.log"
            grep -Fx 'MSI_COMPONENT_RESULT checks=193 failures=0' "$msi_dir/runtime.log"
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/msi-handles$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/msi-handles$arch.log"
            grep -E '^queries=100 handles_before=[0-9]+ handles_after=[0-9]+ delta=0 positive_control=16$' "$RUNNER_TEMP/soda-office-winrt/msi-handles$arch.log"
            LIBGL_ALWAYS_SOFTWARE=1 "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/dashes$arch.exe" \
              "Z:$RUNNER_TEMP/soda-office-winrt/dashes$arch.png" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/dashes$arch.log"
            grep -E '^DASH_RESULT checks=[1-9][0-9]* failures=0$' "$RUNNER_TEMP/soda-office-winrt/dashes$arch.log"
            LIBGL_ALWAYS_SOFTWARE=1 "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/scaled-dashes$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/scaled-dashes$arch.log"
            grep -E '^SCALED_DASH_RESULT checks=[1-9][0-9]* failures=0$' "$RUNNER_TEMP/soda-office-winrt/scaled-dashes$arch.log"
            for apartment in sta mta; do
              "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/inertia$arch.exe" "$apartment" \
                | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/inertia$arch-$apartment.log"
              grep -E '^INERTIA_OBJECT_CHECKS:[1-9][0-9]* failures:0$' "$RUNNER_TEMP/soda-office-winrt/inertia$arch-$apartment.log"
            done
            control_dir="$RUNNER_TEMP/soda-office-winrt/control-$arch"
            "$runner_dir/bin/wine" "$control_dir/client.exe" \
              "Z:$control_dir/fixtures, with space/applet.cpl" "Z:$control_dir/results" \
              | tr -d '\r' | tee "$control_dir/runtime.log"
            grep -Fx 'CPL_HOST_RESULT checks=32 failures=0' "$control_dir/runtime.log"
            mapi_dir="$RUNNER_TEMP/soda-office-winrt/mapi-client$arch"
            "$runner_dir/bin/wine" "$mapi_dir/client.exe" "Z:$mapi_dir/OLMAPI32.DLL" \
              | tr -d '\r' | tee "$mapi_dir/runtime.log"
            grep -Fx 'MAPI_CLIENT_RESULT failures=0' "$mapi_dir/runtime.log"
            mkdir -p "$mapi_dir/no-mime"
            cp "$mapi_dir/OLMAPI32.DLL" "$mapi_dir/no-mime/OLMAPI32.DLL"
            "$runner_dir/bin/wine" "$mapi_dir/client.exe" "Z:$mapi_dir/no-mime/OLMAPI32.DLL" no-mime \
              | tr -d '\r' | tee "$mapi_dir/absent-mime.log"
            grep -Fx 'MAPI_CLIENT_ABSENT_MIME_RESULT failures=0' "$mapi_dir/absent-mime.log"
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/smoke$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/runtime$arch.log"
            for factory in core_application message_websocket protection_policy retail_info web_authentication_manager composition_effect_source_parameter; do
              grep -Fx "$factory:00000000" "$RUNNER_TEMP/soda-office-winrt/runtime$arch.log"
            done
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/brush$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/brush$arch.log"
            grep -E '^composition_brush_checks:[1-9][0-9]* failures:0$' "$RUNNER_TEMP/soda-office-winrt/brush$arch.log"
            for probe in surface callbacks graphics-device; do
              "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/composition-$probe$arch.exe" \
                | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/composition-$probe$arch.log"
              if [[ "$probe" == surface ]]; then result=SURFACE_COMMIT_RESULT
              elif [[ "$probe" == callbacks ]]; then result=CONTROLLER_CALLBACK_RESULT
              else result=GRAPHICS_DEVICE_RESULT; fi
              grep -E "^$result checks=[1-9][0-9]* failures=0$" "$RUNNER_TEMP/soda-office-winrt/composition-$probe$arch.log"
            done
            for apartment in sta mta; do
              "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/ink$arch.exe" "$apartment" \
                | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/ink$arch-$apartment.log"
              grep -Fx 'QUEUE_RESULT callbacks=64 destroyed=64 failures=0' "$RUNNER_TEMP/soda-office-winrt/ink$arch-$apartment.log"
              "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/ink-values$arch.exe" "$apartment" \
                | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/ink-values$arch-$apartment.log"
              grep -E '^INK_VALUE_RESULT checks=[1-9][0-9]* failures=0$' "$RUNNER_TEMP/soda-office-winrt/ink-values$arch-$apartment.log"
              for probe in source input drying; do
                "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/ink-core-$probe$arch.exe" "$apartment" \
                  | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/ink-core-$probe$arch-$apartment.log"
                grep -E "^INK_${probe^^}_RESULT checks=[1-9][0-9]* failures=0$" "$RUNNER_TEMP/soda-office-winrt/ink-core-$probe$arch-$apartment.log"
              done
            done
            "$runner_dir/bin/wine" reg add \
              "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ldap$arch.exe" \
              /v GlobalFlag /t REG_DWORD /d 112 /f
            "$runner_dir/bin/wine" "$RUNNER_TEMP/soda-office-winrt/ldap$arch.exe" \
              | tr -d '\r' | tee "$RUNNER_TEMP/soda-office-winrt/ldap$arch.log"
            grep -Fx 'ldap_init_checks:1024 failures:0' "$RUNNER_TEMP/soda-office-winrt/ldap$arch.log"
          done
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then other=32; else other=64; fi
            directory="$RUNNER_TEMP/soda-office-winrt/control-$bits"
            export SODA_CPL_FIXTURE_PATH="Z:$RUNNER_TEMP/soda-office-winrt/control-$other/fixtures, with space/applet.cpl"
            for path in "$SODA_CPL_FIXTURE_PATH" '%SODA_CPL_FIXTURE_PATH%'; do
              "$runner_dir/bin/wine" "$directory/client.exe" "$path" "Z:$directory/results" \
                | tr -d '\r' | tee "$directory/cross-machine.log"
              grep -Fx 'CPL_HOST_RESULT checks=32 failures=0' "$directory/cross-machine.log"
            done
          done
          "$runner_dir/bin/wineserver" -w

      - name: verify imported type library lookup
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 10
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          .github/check-typelib-imports.sh "/tmp/$COMPONENT_NAME" \
            "$HOME/artifacts/soda-typelib-imports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: verify service startup timeout
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 5
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          export FEX_APP_CONFIG="$runner_dir/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$runner_dir/share/fex-emu"
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-service-timeout"
          mkdir -p "$work"
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          export WINEPREFIX="$work/prefix" WINEARCH=win64 WINEDEBUG=-all
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-service-timeout-smoke.c" \
            -municode -O2 -Wall -Wextra -Werror -ladvapi32 -o "$work/service-timeout.exe"
          trap '"$runner_dir/bin/wineserver" -k; "$runner_dir/bin/wineserver" -w' EXIT
          "$runner_dir/bin/wine" reg add 'HKLM\System\CurrentControlSet\Control' \
            /v ServicesPipeTimeout /t REG_DWORD /d 60000 /f
          "$runner_dir/bin/wineserver" -k
          "$runner_dir/bin/wineserver" -w
          "$runner_dir/bin/wineserver" -p
          "$runner_dir/bin/wine" "$work/service-timeout.exe" install
          "$runner_dir/bin/wine" "$work/service-timeout.exe" run-pass \
            | tr -d '\r' | tee "$work/runtime.log"
          grep -Fx 'SERVICE_START_RESULT failures=0' "$work/runtime.log"

      - name: verify application registry hives
        shell: xvfb-run -a bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 10
        env:
          COMPONENT_NAME: ${{ steps.identity.outputs.component_name }}
        run: |
          runner_dir="/tmp/$COMPONENT_NAME"
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-registry"
          mkdir -p "$work/source"
          echo "REGISTRY_WORK=$work" >> "$GITHUB_ENV"
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          export WINEPREFIX="$work/prefix" WINEARCH=win64 WINEDEBUG=-all
          export WINEDLLOVERRIDES='mscoree,mshtml,winedbg.exe='
          export FEX_APP_CONFIG="$runner_dir/share/fex-emu/Config.json"
          export FEX_APP_CONFIG_LOCATION="$runner_dir/share/fex-emu"
          trap '"$runner_dir/bin/wineserver" -k || true; "$runner_dir/bin/wineserver" -w || true' EXIT
          git -C "$work/source" apply --include=server/registry_hive.c --include=server/registry_hive.h \
            "$GITHUB_WORKSPACE/wine-tkg-userpatches/registry-hive-codec.mypatch"
          env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" wineboot -u > "$work/wineboot.log" 2>&1
          for bits in 64 32; do
            if [[ "$bits" == 64 ]]; then compiler=x86_64-w64-mingw32-gcc; else compiler=i686-w64-mingw32-gcc; fi
            mkdir "$work/fixtures$bits"
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-registry-app-hive.c" \
              "$work/source/server/registry_hive.c" -I"$work/source/server" -DREGISTRY_HIVE_CODEC \
              -municode -O2 -Wall -Wextra -Werror -ladvapi32 -o "$work/registry$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/registry$bits.exe" \
              "$work/fixtures$bits" "$work/registry$bits.dat" > "$work/registry$bits.jsonl" 2> "$work/registry$bits.stderr"
            python3 - "$work" "$bits" <<'PYCODE'
          import json
          from pathlib import Path
          import sys
          work, bits = Path(sys.argv[1]), sys.argv[2]
          records = [json.loads(line) for line in (work / f'registry{bits}.jsonl').read_text().splitlines()]
          assert records and records[-1] == {'checks': 230, 'failures': 0}, records[-1:] or 'No SDK output'
          assert all(row['result'] == row['expected'] for row in records if 'expected' in row)
          assert not list((work / f'fixtures{bits}').iterdir()), 'Registry fixture files remain'
          print(f'Registry {bits}-bit:230checks pass')
          PYCODE
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-crypt32-oid.c" \
              -O2 -Wall -Wextra -Werror -lcrypt32 -o "$work/oid$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/oid$bits.exe" \
              | tr -d '\r' | tee "$work/oid$bits.log"
            grep -Fx 'OID metadata: 31 checks, 0 failures' "$work/oid$bits.log"
            "$compiler" "$GITHUB_WORKSPACE/eagle/tests/export.c" \
              -shared -s -O2 -Wall -Wextra -Werror -o "$work/export-fixture$bits.dll"
            "$compiler" "$GITHUB_WORKSPACE/.github/soda-dbghelp-exports.c" \
              -O2 -Wall -Wextra -Werror -ldbghelp -o "$work/exports$bits.exe"
            env -u GH_TOKEN -u GITHUB_TOKEN "$runner_dir/bin/wine" "$work/exports$bits.exe" \
              "export-fixture$bits.dll" | tr -d '\r' | tee "$work/exports$bits.log"
            grep -Fx 'failures=0' "$work/exports$bits.log"
          done

      - uses: actions/upload-artifact@v7
        if: always() && env.REGISTRY_WORK != ''
        with:
          name: registry-runtime-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ env.REGISTRY_WORK }}/registry64.jsonl
            ${{ env.REGISTRY_WORK }}/registry32.jsonl
            ${{ env.REGISTRY_WORK }}/registry64.stderr
            ${{ env.REGISTRY_WORK }}/registry32.stderr
            ${{ env.REGISTRY_WORK }}/registry64.exe
            ${{ env.REGISTRY_WORK }}/registry32.exe
            ${{ env.REGISTRY_WORK }}/wineboot.log
            ${{ env.REGISTRY_WORK }}/oid64.log
            ${{ env.REGISTRY_WORK }}/oid32.log
            ${{ env.REGISTRY_WORK }}/exports64.log
            ${{ env.REGISTRY_WORK }}/exports32.log
          if-no-files-found: error
          retention-days: 7

      - name: compiler cache statistics
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        run: ccache --show-stats

      - name: save compiler cache
        if: always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  recovery:
    if: >-
      inputs.winrt_http_reference != true &&
      github.event_name == 'workflow_dispatch' &&
      inputs.recovery_run != '' &&
      github.ref == 'refs/heads/soda'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.recovery_run }}
      SOURCE_COMMIT: 'bc771c1b76056ae0bfb3d4ce659b436175a072cd'
      XZ_DEFAULTS: '-T2'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify completed builds
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work/t" "$work/release" "$work/logs"
          export TMPDIR="$work/t" TMP="$work/t" TEMP="$work/t"
          echo "RECOVERY_WORK=$work" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/t" >> "$GITHUB_ENV"
          echo "TMP=$work/t" >> "$GITHUB_ENV"
          echo "TEMP=$work/t" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$work/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > "$work/jobs.json"
          python3 - "$work" <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import sys
          work = Path(sys.argv[1])
          run = json.loads((work / 'run.json').read_text())
          jobs = json.loads((work / 'jobs.json').read_text())['jobs']
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['head_branch'] == 'soda' and run['event'] == 'push'
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert run['path'] == '.github/workflows/build-soda.yml'
          for name in ('patches', 'arm64'):
              assert next(job for job in jobs if job['name'] == name)['conclusion'] == 'success'
          steps = next(job for job in jobs if job['name'] == 'build')['steps']
          package = next(i for i, step in enumerate(steps) if step['name'] == 'package')
          assert all(step['conclusion'] == 'success' or (step['name'] == 'Upload prepare.log on failure' and step['conclusion'] == 'skipped') for step in steps[:package])
          assert steps[package]['conclusion'] == 'failure'
          assert [step['name'] for step in steps if step['conclusion'] == 'failure'] == ['package']
          print('Completed Wine builds and runtime tests verified; Eagle package tests will run again')
          PYCODE
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude).github/workflows/build-soda.yml' ':(exclude)eagle/tests/test_tracing.py' ':(exclude)eagle/tests/target.c')"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import subprocess
          path = '.github/workflows/build-soda.yml'
          original = subprocess.check_output(['git', 'show', os.environ['SOURCE_COMMIT'] + ':' + path], text=True)
          current = Path(path).read_text()
          def build_inputs(text):
              before, recovery = text.split('  recovery:\n', 1)
              return before + '  release:\n' + recovery.split('  release:\n', 1)[1]
          assert build_inputs(original) == build_inputs(current), 'Wine build inputs changed'
          PYCODE

      - name: setup
        timeout-minutes: 20
        working-directory: /home/runner/work/
        run: |
          mkdir -p /home/runner/.config/frogminer/
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt purge -y ubuntu-advantage-tools python3-update-manager
          sudo dpkg --add-architecture i386 && sudo apt update
          sudo apt-mark hold grub-common grub-efi-amd64-bin python3 python3-apt shim-signed
          sudo apt install aptitude
          sudo aptitude remove -y '?narrow(?installed,?version(deb.sury.org))'
          sudo apt install -f
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcap-dev:amd64 libpcap-dev:i386
          sudo apt-get install -y libglib2.0-dev-bin libglib2.0-dev:amd64
          sudo aptitude install -y -o Dpkg::Options::="--force-overwrite" \
            libglib2.0-dev-bin:amd64 \
            libgudev-1.0-dev:amd64 \
            libgudev-1.0-dev:i386 \
            libvulkan-dev:amd64 \
            libvulkan-dev:i386
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" libpcsclite-dev:amd64 libpcsclite-dev:i386
          sudo apt-get install -y libsecret-1-dev:amd64 libsecret-1-0:i386
          sudo apt-get install -y libfreetype6:amd64 libfreetype6:i386 libfontconfig1:amd64 libfontconfig1:i386
          bash "$GITHUB_WORKSPACE/.github/soda-secret-headers.sh" "$GITHUB_WORKSPACE/.soda-secret-amd64" amd64
          bash "$GITHUB_WORKSPACE/.github/soda-secret-headers.sh" "$GITHUB_WORKSPACE/.soda-secret-i386" i386
          sudo apt-get install -y \
            g++ \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libjson-c-dev:amd64 \
            libsqlite3-dev:amd64 \
            cmake \
            file \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            libopenxr-dev:amd64 \
            "libopenxr1-monado=$MONADO_VERSION" \
            mesa-vulkan-drivers \
            libgl1-mesa-dri:amd64 \
            libgl1-mesa-dri:i386 \
            libglx-mesa0:amd64 \
            libglx-mesa0:i386 \
            "monado-service=$MONADO_VERSION" \
            ninja-build \
            xvfb
          sudo apt-get install -y libgstreamer-plugins-base1.0-0:amd64 libgstreamer-plugins-base1.0-0:i386 \
            libgstreamer-gl1.0-0:amd64 libgstreamer-gl1.0-0:i386 libavformat60:amd64 libavformat60:i386
          sudo apt-get check
          mkdir -p "$HOME/artifacts"
          llvm_key="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-llvm.asc"
          curl -fL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$llvm_key"
          printf '%s  %s\n' 8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d "$llvm_key" | sha256sum --check -
          sudo install -m644 "$llvm_key" /usr/share/keyrings/soda-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/soda-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/soda-llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-22=$LLVM_TOOLS_VERSION" "lld-22=$LLVM_TOOLS_VERSION" "llvm-22=$LLVM_TOOLS_VERSION"
          for tool in clang lld-link llvm-objcopy llvm-symbolizer; do
            "/usr/lib/llvm-22/bin/$tool" --version
          done

      - name: verify x86_64 Wine and Eagle
        timeout-minutes: 25
        run: |
          work="$RECOVERY_WORK"
          component="soda-$WINE_VERSION-$REVISION"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "pre-test-$component-x86_64" --dir "$work/runner"
          wine="$(find "$work/runner" -maxdepth 3 -type f -path '*/bin/wine' -print)"
          test "$(printf '%s\n' "$wine" | wc -l)" = 1
          test -n "$wine"
          runner="${wine%/bin/wine}"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "pre-test-symbols-$component-x86_64" --dir "$work/symbols/$component-x86_64"
          chmod +x "$runner"/bin/*
          for arch in i386 x86_64; do
            for loader in wine wine64 wine-preloader wine64-preloader; do
              path="$runner/lib/wine/$arch-unix/$loader"
              if test -f "$path"; then chmod +x "$path"; fi
            done
          done
          for name in msidb msiexec notepad regedit regsvr32 wineboot winecfg wineconsole winedbg winefile winemine winepath; do
            cmp "$runner/bin/$name" "$runner/bin/wine"
            ln -sf wine "$runner/bin/$name"
          done
          for name in winecpp wineg++; do
            cmp "$runner/bin/$name" "$runner/bin/winegcc"
            ln -sf winegcc "$runner/bin/$name"
          done
          install -d "$runner/share/openxr"
          curl -fL "https://raw.githubusercontent.com/ValveSoftware/Proton/$PROTON_COMMIT/wineopenxr/wineopenxr64.json" \
            -o "$runner/share/openxr/wineopenxr64.json"
          file "$runner/bin/wine" | grep -F 'x86-64'
          for arch in i386 x86_64; do
            test -f "$runner/lib/wine/$arch-unix/winegstreamer.so"
            test -f "$runner/lib/wine/$arch-unix/winscard.so"
            test -f "$runner/lib/wine/$arch-unix/windows.security.authentication.onlineid.so"
          done
          test -f "$runner/lib/wine/x86_64-unix/wineopenxr.so"
          for image in "$runner/bin/wine" "$runner/bin/wineserver" "$runner/lib/wine/x86_64-unix/ntdll.so" "$runner/lib/wine/i386-unix/ntdll.so"; do
            ldd "$image"
          done
          for arch in i386 x86_64; do
            LD_LIBRARY_PATH="$runner/lib/wine/$arch-unix" ldd "$runner/lib/wine/$arch-unix/win32u.so"
            LD_LIBRARY_PATH="$runner/lib/wine/$arch-unix" ldd "$runner/lib/wine/$arch-unix/winex11.so"
          done
          for arch in i386 x86_64; do
            for module in winegstreamer winedmo; do
              dependencies="$(LD_LIBRARY_PATH="$runner/lib/wine/$arch-unix" ldd "$runner/lib/wine/$arch-unix/$module.so")"
              printf '%s\n' "$dependencies"
              if grep -F 'not found' <<< "$dependencies"; then exit 1; fi
            done
          done
          mkdir -p "$work/probe"
          if ! WINEPREFIX="$work/probe/prefix" WINEARCH=win64 WINEDEBUG=-all,+module,+seh,+wineboot \
            xvfb-run -a timeout 180 env -u GH_TOKEN -u GITHUB_TOKEN "$runner/bin/wine" wineboot -u \
              > "$work/logs/prefix-loader.log" 2>&1; then
            tail -n 80 "$work/logs/prefix-loader.log"
            exit 1
          fi
          WINEPREFIX="$work/probe/prefix" "$runner/bin/wineserver" -k || true
          WINEPREFIX="$work/probe/prefix" timeout 30 "$runner/bin/wineserver" -w
          eagle_work="$HOME/artifacts/Eagle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ln -s "$eagle_work" "$work/eagle"
          WINEDEBUG=-all,+module,+seh,+loaddll PATH="/usr/lib/llvm-22/bin:$PATH" xvfb-run -a sh "$GITHUB_WORKSPACE/.github/build-eagle.sh" "$runner" "$eagle_work"
          sh "$GITHUB_WORKSPACE/.github/soda-provenance.sh" "$runner" "$work/provenance" \
            --name "$component-x86_64" --refresh --prebuilt --assembly-source "$GITHUB_WORKSPACE"
          tools="$work/provenance/native"
          python3 -S "$GITHUB_WORKSPACE/.github/soda-symbols.py" "$runner" "$work/symbols/$component-x86_64" \
            --tools "$tools" --verify
          cp "$runner/share/soda/"{build,files,sources}.json "$work/symbols/$component-x86_64/share/soda/"
          mv "$runner" "$work/release/$component-x86_64"

      - name: package x86_64 archives
        timeout-minutes: 20
        run: |
          work="$RECOVERY_WORK"
          component="soda-$WINE_VERSION-$REVISION"
          tar -C "$work/release" -cJf "$work/release/$component-x86_64.tar.xz" "$component-x86_64"
          tar -C "$work/symbols" -cJf "$work/release/$component-x86_64-symbols.tar.xz" "$component-x86_64"

      - name: verify ARM64 artifacts
        timeout-minutes: 15
        run: |
          work="$RECOVERY_WORK"
          component="soda-$WINE_VERSION-$REVISION"
          tools="$work/provenance/native"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$component-aarch64" --dir "$work/release"
          mkdir "$work/arm64" "$work/arm64-symbols"
          tar -C "$work/arm64" -xJf "$work/release/$component-aarch64.tar.xz"
          tar -C "$work/arm64-symbols" -xJf "$work/release/$component-aarch64-symbols.tar.xz"
          runner="$work/arm64/$component-aarch64"
          python3 -S "$GITHUB_WORKSPACE/.github/soda-symbols.py" "$runner" "$work/arm64-symbols/$component-aarch64" \
            --tools "$tools" --verify
          sh "$GITHUB_WORKSPACE/.github/soda-provenance.sh" "$runner" "$work/arm64-provenance" \
            --name "$component-aarch64" --refresh --assembly-source "$GITHUB_WORKSPACE"
          cp "$runner/share/soda/"{build,files,sources}.json "$work/arm64-symbols/$component-aarch64/share/soda/"

      - name: package ARM64 archives
        timeout-minutes: 20
        run: |
          work="$RECOVERY_WORK"
          component="soda-$WINE_VERSION-$REVISION"
          tar -C "$work/arm64" -cJf "$work/release/$component-aarch64.tar.xz" "$component-aarch64"
          tar -C "$work/arm64-symbols" -cJf "$work/release/$component-aarch64-symbols.tar.xz" "$component-aarch64"
          cd "$work/release"
          sha256sum "$component-"*.tar.xz > SHA256SUMS

      - name: collect package test logs
        if: always()
        run: |
          work="$RECOVERY_WORK"
          for log in "$work"/eagle/tests/{32,64,p32,p64,c32,c64,s32,s64,i32,i64,j32,j64,k32,k64,l32,l64,d,t,e}/*.log "$work"/eagle/tests/{j32,j64,k32,k64,l32,l64}/*/*.log; do
            test -f "$log" || continue
            relative=${log#"$work/eagle/tests/"}
            cp "$log" "$work/logs/${relative//\//-}"
          done

      - name: upload package test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eagle-recovery-test-logs-${{ github.sha }}
          path: |
            ${{ env.RECOVERY_WORK }}/logs/*.log
            ${{ env.RECOVERY_WORK }}/eagle/tests/prefix/logs/runs/*.session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/j32/*/session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/j64/*/session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/k32/*/session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/k64/*/session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/l32/*/session/*.json*
            ${{ env.RECOVERY_WORK }}/eagle/tests/l64/*/session/*.json*
          if-no-files-found: error

      - name: upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: soda-package-recovery-${{ github.sha }}
          path: |
            ${{ env.RECOVERY_WORK }}/release/*.tar.xz
            ${{ env.RECOVERY_WORK }}/release/SHA256SUMS
          if-no-files-found: error

      - name: release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          component="soda-$WINE_VERSION-$REVISION"
          cd "$RECOVERY_WORK/release"
          if gh release view "$component" >/dev/null 2>&1; then
            echo "Release $component already exists." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RECOVERY_WORK/notes.md"
          title="Soda $WINE_VERSION-$REVISION"
          if [[ -n "$RELEASE_CODENAME" ]]; then title="$title - $RELEASE_CODENAME"; fi
          gh release create "$component" "$component-x86_64.tar.xz" "$component-x86_64-symbols.tar.xz" "$component-aarch64.tar.xz" "$component-aarch64-symbols.tar.xz" SHA256SUMS \
            --target "$GITHUB_SHA" --title "$title" \
            --notes-file "$RECOVERY_WORK/notes.md" --prerelease

  release:
    needs:
      - build
      - arm64
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.component_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.arm64.outputs.component_name }}

      - name: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/soda'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          ARM64_ARCHIVE_NAME: ${{ needs.arm64.outputs.archive_name }}
          SYMBOLS_ARCHIVE_NAME: ${{ needs.build.outputs.component_name }}-symbols.tar.xz
          ARM64_SYMBOLS_ARCHIVE_NAME: ${{ needs.arm64.outputs.component_name }}-symbols.tar.xz
        run: |
          tag="soda-$WINE_VERSION-$REVISION"
          title="Soda $WINE_VERSION-$REVISION"
          file="$ARCHIVE_NAME"
          arm64_file="$ARM64_ARCHIVE_NAME"
          release_flags=(--latest)
          if [[ -n "$RELEASE_CODENAME" ]]; then
            title="$title - $RELEASE_CODENAME"
          fi
          if [[ "${{ needs.build.outputs.prerelease }}" == "true" ]]; then
            release_flags=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          test -s "$SYMBOLS_ARCHIVE_NAME"
          test -s "$ARM64_SYMBOLS_ARCHIVE_NAME"
          sha256sum "$file" "$arm64_file" "$SYMBOLS_ARCHIVE_NAME" "$ARM64_SYMBOLS_ARCHIVE_NAME" > SHA256SUMS
          gh release create "$tag" "$file" "$arm64_file" "$SYMBOLS_ARCHIVE_NAME" "$ARM64_SYMBOLS_ARCHIVE_NAME" SHA256SUMS --target "$GITHUB_SHA" --title "$title" --notes "$RELEASE_NOTES" "${release_flags[@]}"
