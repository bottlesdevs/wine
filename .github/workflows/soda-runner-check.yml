name: soda-runner-check

on:
  push:
    branches:
      - 'feat/soda-next'
    paths:
      - '.github/workflows/soda-runner-check.yml'

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: '33346708971'
      SOURCE_ARTIFACT: pre-test-soda-11.0-7-8f47303-x86_64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 xvfb
          mkdir /tmp/soda-runner
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir /tmp/soda-runner

      - name: check Heroes VII topology
        run: |
          runner_dir="$(find /tmp/soda-runner -mindepth 1 -maxdepth 1 -type d -name 'wine-tkg-*' -print -quit)"
          test -n "$runner_dir"
          x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/.github/soda-compatibility-smoke.c" \
            -O2 -municode -lshell32 -o /tmp/soda-compatibility-smoke.exe
          mkdir /tmp/soda-browser-bin
          printf '%s\n' '#!/bin/sh' 'printf "%s" "$1" > /tmp/soda-browser-url' > /tmp/soda-browser-bin/xdg-open
          chmod +x /tmp/soda-browser-bin/xdg-open
          export PATH="/tmp/soda-browser-bin:$PATH"
          export WINEDEBUG=-all
          export WINEPREFIX=/tmp/soda-url-prefix
          export WINEARCH=win64
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          xvfb-run -a "$runner_dir/bin/wine" reg add 'HKCU\Software\Wine\WineBrowser' /v Browsers /t REG_SZ /d xdg-open /f
          long_url="https://soda.invalid/$(printf 'a%.0s' {1..1024})"
          xvfb-run -a "$runner_dir/bin/wine" /tmp/soda-compatibility-smoke.exe "$long_url"
          for attempt in {1..50}; do
            test ! -f /tmp/soda-browser-url || break
            sleep 0.1
          done
          test "$(cat /tmp/soda-browser-url)" = "$long_url"
          "$runner_dir/bin/wineserver" -w

          export WINEPREFIX=/tmp/soda-topology-prefix
          export WINE_CPU_TOPOLOGY=2
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u
          xvfb-run -a "$runner_dir/bin/wine" cmd /c echo '%NUMBER_OF_PROCESSORS%'
          "$runner_dir/bin/wineserver" -w

          unset WINE_CPU_TOPOLOGY WINEDEBUG
          target=/tmp/MMH7Game-Win64-Shipping.exe
          cp "$runner_dir/lib/wine/x86_64-windows/cmd.exe" "$target"
          export WINEPREFIX=/tmp/soda-heroes-vii-prefix
          mkdir -p "$WINEPREFIX"
          xvfb-run -a "$runner_dir/bin/wineboot" -u

          set +e
          xvfb-run -a "$runner_dir/bin/wine" "$target" \
            /c echo '%NUMBER_OF_PROCESSORS%' >/tmp/renamed.out 2>/tmp/renamed.log
          renamed_status=$?
          xvfb-run -a "$runner_dir/bin/wine" \
            "$runner_dir/lib/wine/x86_64-windows/cmd.exe" \
            /c echo '%NUMBER_OF_PROCESSORS%' >/tmp/original.out 2>/tmp/original.log
          original_status=$?
          set -e

          printf 'renamed status=%s\n' "$renamed_status"
          cat /tmp/renamed.out /tmp/renamed.log
          printf 'original status=%s\n' "$original_status"
          cat /tmp/original.out /tmp/original.log
          test "$renamed_status" -eq 0
          test "$original_status" -eq 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soda-runner-check-logs
          path: |
            /tmp/renamed.out
            /tmp/renamed.log
            /tmp/original.out
            /tmp/original.log
          if-no-files-found: error
