name: Office ARM64 installation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: prepare published runner
        run: |
          work="$HOME/artifacts/Soda-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-office-arm64"
          mkdir -p "$work/scratch" "$work/runner" "$work/results" "$work/office-home"
          mkdir -m 700 "$work/office-runtime"
          printf 'OFFICE_WORK=%s\nTMPDIR=%s/scratch\nTMP=%s/scratch\nTEMP=%s/scratch\n' \
            "$work" "$work" "$work" "$work" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 \
            https://github.com/bottlesdevs/wine/releases/download/soda-11.0-36-experimental/soda-11.0-36-experimental-aarch64.tar.xz \
            -o "$work/runner.tar.xz"
          printf '%s  %s\n' 3e3977025aa3417dccd85ab27d217420f7cc6f327590e5a24c92d14fdfa20d6f "$work/runner.tar.xz" | sha256sum --check -
          tar -xJf "$work/runner.tar.xz" -C "$work/runner"
          rm "$work/runner.tar.xz"
          cp .github/soda-office-arm64-install.py "$work/install.py"
          cp .github/soda-office-diagnostics.py "$work/office-diagnostics.py"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: install in an anonymous ARM bottle
        run: |
          image=ghcr.io/bottlesdevs/bottles@sha256:62d481f926b6f06160cfd3f442c6d1fb6f12a8b0e7efc470ae541b2cc7ab1660
          docker pull --platform linux/arm64 "$image"
          runner="$OFFICE_WORK/runner/soda-11.0-36-experimental-aarch64"
          test -x "$runner/bin/wine"
          xvfb-run -a -s '-screen 0 1440x900x24' \
            docker run --rm --platform linux/arm64 --network host --hostname "$(hostname)" \
              --user "$(id -u):$(id -g)" \
              --volume "$OFFICE_WORK:$OFFICE_WORK" \
              --volume /etc/passwd:/etc/passwd:ro --volume /etc/group:/etc/group:ro \
              --env "USER=$(id -un)" --env "LOGNAME=$(id -un)" \
              --env "HOME=$OFFICE_WORK/office-home" \
              --env "XDG_DATA_HOME=$OFFICE_WORK/office-home/data" \
              --env "XDG_CONFIG_HOME=$OFFICE_WORK/office-home/config" \
              --env "XDG_CACHE_HOME=$OFFICE_WORK/office-home/cache" \
              --env "XDG_RUNTIME_DIR=$OFFICE_WORK/office-runtime" \
              --env PERSONAL_DEPENDENCIES=https://raw.githubusercontent.com/bottlesdevs/dependencies/79d3db76c517d25812af1e33c5baf4aefe963ceb/ \
              --env PERSONAL_INSTALLERS=https://raw.githubusercontent.com/bottlesdevs/programs/e137e8db4b838ff5049c10c1f8203ee12c31de2c/ \
              --env "TMPDIR=$OFFICE_WORK/scratch" --env "TMP=$OFFICE_WORK/scratch" --env "TEMP=$OFFICE_WORK/scratch" \
              --env DISPLAY --env XAUTHORITY --env LIBGL_ALWAYS_SOFTWARE=1 --env GDK_BACKEND=x11 \
              --entrypoint /usr/bin/python3 "$image" "$OFFICE_WORK/install.py" "$OFFICE_WORK" "$runner" \
            2>&1 | tee "$OFFICE_WORK/results/console.log"

      - uses: actions/upload-artifact@v7
        if: always() && env.OFFICE_WORK != ''
        with:
          name: office-arm64-install-${{ github.sha }}
          path: ${{ env.OFFICE_WORK }}/results
          if-no-files-found: warn
          retention-days: 7
