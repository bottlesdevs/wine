name: build-mcsoda

on:
  push:
    branches:
      - 'mcsoda'
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Run ID containing McSoda artifacts'
        required: false
        type: string
      reuse_revision:
        description: 'Revision used by the reused artifact'
        required: false
        type: string
      publish:
        description: 'Publish the tested artifacts'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-mcsoda-${{ github.ref }}
  cancel-in-progress: true

env:
  WINE_VERSION: '11.0'
  REVISION: '3'
  VALVE_WINE_TAG: 'experimental-wine-bleeding-edge-11.0-411656-20260810-pc1d824-w99166a-d3a4c6f-v731c4a'
  VALVE_WINE_COMMIT: '99166a7e25b08ccef0168217540542260eaed76f'
  WINE_TKG_COMMIT: '6e1c41342a249e0029c1f35f36775e1caa5ce1d1'
  BUILD_TOOLS_COMMIT: 'fcba104217c6daddddebe69d2dc2e39bc9025848'
  CROSSOVER_VERSION: '26.3.0'
  CROSSOVER_SHA256: 'ac99c8ca4b3848f3e81784135f023df266b61c2345726ea55a50b3e030dd6872'
  LLVM_MINGW_VERSION: '20260616'
  LLVM_MINGW_SHA256: '2cab02a2e964bd4aae981150a45985d07c657cfa8d244959eb9e2dcc5eedd7b1'
  WINE_MONO_VERSION: '10.4.1'
  WINE_MONO_SHA256: '071f4b2887e1c97a11d791ff3d65be9429eed6dec4c2708888bfd546ba358e23'
  WINE_GECKO_VERSION: '2.47.4'
  WINE_GECKO_X86_SHA256: '26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6'
  WINE_GECKO_X86_64_SHA256: 'e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f'
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  smoke-programs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build smoke programs
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          i686-w64-mingw32-gcc .github/tests/mcsoda-smoke.c -o "$RUNNER_TEMP/smoke-x86.exe" -lgdi32
          x86_64-w64-mingw32-gcc .github/tests/mcsoda-smoke.c -o "$RUNNER_TEMP/smoke-x86_64.exe" -lgdi32
          i686-w64-mingw32-gcc .github/tests/mcsoda-audio.c -o "$RUNNER_TEMP/audio-x86.exe" -lwinmm
          x86_64-w64-mingw32-gcc .github/tests/mcsoda-audio.c -o "$RUNNER_TEMP/audio-x86_64.exe" -lwinmm
          for architecture in i686 x86_64
          do
            compiler="$architecture-w64-mingw32-gcc"
            "$compiler" .github/tests/mcsoda-dll-path-test.c -o "$RUNNER_TEMP/dll-path-test-$architecture.exe"
          done
          install -m644 .github/tests/mcsoda-libd3dshared.c "$RUNNER_TEMP/mcsoda-libd3dshared.c"
          install -m644 .github/tests/mcsoda-libd3dshared-test.c "$RUNNER_TEMP/mcsoda-libd3dshared-test.c"

      - uses: actions/upload-artifact@v4
        with:
          name: mcsoda-smoke-programs
          path: |
            ${{ runner.temp }}/smoke-x86.exe
            ${{ runner.temp }}/smoke-x86_64.exe
            ${{ runner.temp }}/audio-x86.exe
            ${{ runner.temp }}/audio-x86_64.exe
            ${{ runner.temp }}/dll-path-test-i686.exe
            ${{ runner.temp }}/dll-path-test-x86_64.exe
            ${{ runner.temp }}/mcsoda-libd3dshared.c
            ${{ runner.temp }}/mcsoda-libd3dshared-test.c
          if-no-files-found: error

  normalize-reused-artifact:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '' }}
    runs-on: macos-26-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer
        run: brew install gstreamer libnice-gstreamer

      - uses: actions/download-artifact@v4
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ inputs.reuse_revision || env.REVISION }}-x86_64
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}

      - name: Normalize runner archive
        run: |
          source_revision="${{ inputs.reuse_revision || env.REVISION }}"
          source_package="mcsoda-$WINE_VERSION-$source_revision-x86_64"
          package="mcsoda-$WINE_VERSION-$REVISION-x86_64"
          cd "$RUNNER_TEMP/artifact"
          tar -xJf "$source_package.tar.xz"
          if test "$source_package" != "$package"
          then
            mv "$source_package" "$package"
          fi
          nice_plugin="$(brew --prefix libnice-gstreamer)/libexec/gstreamer-1.0/libgstnice.dylib"
          rm "$package/lib/gstreamer-1.0/libgstnice.dylib"
          cp -L "$nice_plugin" "$package/lib/gstreamer-1.0/libgstnice.dylib"
          chmod 755 "$package/lib/gstreamer-1.0/libgstnice.dylib"
          MCSODA_BUNDLE_REUSE_EXISTING=1 \
            "$GITHUB_WORKSPACE/.github/scripts/bundle-macos-libraries.sh" "$RUNNER_TEMP/artifact/$package"
          test ! -L "$package/lib/gstreamer-1.0/libgstnice.dylib"
          file "$package/lib/gstreamer-1.0/libgstnice.dylib" | grep -F 'x86_64'
          if [[ -L "$package/lib/wine/x86_64-unix/wine64" && ! -e "$package/lib/wine/x86_64-unix/wine64" ]]; then
            rm "$package/lib/wine/x86_64-unix/wine64"
          fi
          if [[ ! -e "$package/lib/wine/x86_64-unix/wine64" ]]; then
            ln -s wine "$package/lib/wine/x86_64-unix/wine64"
          fi
          rm -f "$package/bin/wine" "$package/bin/wine64"
          install -m755 "$GITHUB_WORKSPACE/mcsoda/launcher.sh" "$package/bin/wine"
          ln -s wine "$package/bin/wine64"
          head -n 1 "$package/bin/wine" | grep -Fx '#!/bin/sh'
          test -x "$package/lib/wine/x86_64-unix/wine64"
          broken_links="$RUNNER_TEMP/broken-links"
          : > "$broken_links"
          while IFS= read -r link
          do
            test -e "$link" || printf '%s\n' "$link" >> "$broken_links"
          done < <(find "$package" -type l -print)
          if test -s "$broken_links"
          then
            cat "$broken_links" >&2
            exit 1
          fi
          rm "$source_package.tar.xz" "$source_package.tar.xz.sha256"
          XZ_OPT=-T0 tar -cJf "$package.tar.xz" "$package"
          test "$(tar -tvJf "$package.tar.xz" "$package/lib/gstreamer-1.0/libgstnice.dylib" | cut -c 1)" = '-'
          shasum -a 256 "$package.tar.xz" > "$package.tar.xz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64-normalized
          path: |
            ${{ runner.temp }}/artifact/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.tar.xz
            ${{ runner.temp }}/artifact/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.tar.xz.sha256
          if-no-files-found: error

  prepare-source:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == '' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - id: soda-source-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/soda-source.tar.xz
          key: mcsoda-source-v1-${{ env.VALVE_WINE_COMMIT }}-${{ env.WINE_TKG_COMMIT }}-${{ env.BUILD_TOOLS_COMMIT }}-${{ hashFiles('wine-tkg-userpatches/mod-loader-prefer-native.mypatch', 'wine-tkg-userpatches/ntdll-adaptive-launch-profile.mypatch', 'wine-tkg-userpatches/ntdll-handle-unmapped-unix-paths.mypatch', 'wine-tkg-userpatches/win32u-fill-depth-only-display-mode.mypatch') }}

      - name: Prepare exact Soda source
        if: steps.soda-source-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Frogging-Family/wine-tkg-git.git "$RUNNER_TEMP/wine-tkg"
          git -C "$RUNNER_TEMP/wine-tkg" checkout "$WINE_TKG_COMMIT"

          profile="$RUNNER_TEMP/wine-tkg/wine-tkg-git/wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg"
          sed -i 's/^_bleeding_tag=.*/_bleeding_tag="'"$VALVE_WINE_TAG"'"/' "$profile"
          grep -Fx '_bleeding_tag="'"$VALVE_WINE_TAG"'"' "$profile"

          config="$RUNNER_TEMP/wine-tkg/wine-tkg-git/customization.cfg"
          sed -i 's/^_LOCAL_PRESET=.*/_LOCAL_PRESET="valve-exp-bleeding"/' "$config"
          sed -i 's/^_nomakepkg_dependency_autoresolver=.*/_nomakepkg_dependency_autoresolver="false"/' "$config"

          install -d "$HOME/.config/frogminer"
          git clone https://github.com/bottlesdevs/build-tools.git "$RUNNER_TEMP/build-tools"
          git -C "$RUNNER_TEMP/build-tools" checkout "$BUILD_TOOLS_COMMIT"
          install -m644 "$RUNNER_TEMP/build-tools/runners/vaniglia/wine-tkg-valve.cfg" "$HOME/.config/frogminer/wine-tkg.cfg"
          printf '%s\n' '_NOCOMPILE="true"' '_NOLIB32="false"' >> "$HOME/.config/frogminer/wine-tkg.cfg"

          patches="$RUNNER_TEMP/wine-tkg/wine-tkg-git/wine-tkg-userpatches"
          install -m644 wine-tkg-userpatches/mod-loader-prefer-native.mypatch "$patches/"
          install -m644 wine-tkg-userpatches/ntdll-adaptive-launch-profile.mypatch "$patches/"
          install -m644 wine-tkg-userpatches/ntdll-handle-unmapped-unix-paths.mypatch "$patches/"
          install -m644 wine-tkg-userpatches/win32u-fill-depth-only-display-mode.mypatch "$patches/"

          cd "$RUNNER_TEMP/wine-tkg/wine-tkg-git"
          yes | ./non-makepkg-build.sh

          source_dir="$RUNNER_TEMP/wine-tkg/wine-tkg-git/src/ValveSoftware-winegit"
          test "$(git -C "$source_dir" merge-base "$VALVE_WINE_COMMIT" HEAD)" = "$VALVE_WINE_COMMIT"
          grep -F "Bleeding edge tag: $VALVE_WINE_TAG" prepare.log
          grep -F "Bleeding edge commit: $VALVE_WINE_COMMIT" prepare.log
          git -C "$source_dir" diff --check

          tar --exclude=.git -cJf "$RUNNER_TEMP/soda-source.tar.xz" -C "$(dirname "$source_dir")" "$(basename "$source_dir")"

      - name: Upload preparation log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcsoda-source-failure
          path: ${{ runner.temp }}/wine-tkg/wine-tkg-git/prepare.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mcsoda-soda-source
          path: ${{ runner.temp }}/soda-source.tar.xz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare-source
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == '' }}
    runs-on: macos-26-intel
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 3G

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mcsoda-soda-source
          path: ${{ runner.temp }}/source-artifact

      - id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: mcsoda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_MINGW_VERSION }}-${{ env.VALVE_WINE_COMMIT }}-${{ hashFiles('.github/workflows/build-mcsoda.yml', 'mcsoda/*.patch', 'mcsoda/*.patch.xz', 'wine-tkg-userpatches/*.mypatch') }}
          restore-keys: |
            mcsoda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_MINGW_VERSION }}-${{ env.VALVE_WINE_COMMIT }}-
            mcsoda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_MINGW_VERSION }}-

      - name: Install build dependencies
        run: |
          brew install \
            bison \
            ccache \
            flex \
            freetype \
            gettext \
            gnutls \
            gstreamer \
            libnice-gstreamer \
            jpeg-turbo \
            libpng \
            libtiff \
            libxml2 \
            libxslt \
            molten-vk \
            mpg123 \
            openal-soft \
            pkgconf \
            sdl2-compat \
            vulkan-loader
          {
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix flex)/bin"
            echo "$(brew --prefix gettext)/bin"
          } >> "$GITHUB_PATH"
          install -d "$RUNNER_TEMP/ccache-bin"
          for compiler in clang clang++ i686-w64-mingw32-clang x86_64-w64-mingw32-clang
          do
            ln -s "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/$compiler"
          done
          printf '%s\n' "CCACHE_BASEDIR=$RUNNER_TEMP" "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - name: Download PE toolchain
        run: |
          toolchain_name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz"
          toolchain_url="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$toolchain_name"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$toolchain_name" "$toolchain_url"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$toolchain_name" | shasum -a 256 --check
          install -d "$RUNNER_TEMP/toolchain"
          tar -xJf "$RUNNER_TEMP/$toolchain_name" -C "$RUNNER_TEMP/toolchain" --strip-components=1

      - name: Apply macOS layer
        run: |
          tar -xJf "$RUNNER_TEMP/source-artifact/soda-source.tar.xz" -C "$RUNNER_TEMP"
          source_dir="$RUNNER_TEMP/ValveSoftware-winegit"
          xz -dc mcsoda/macos-crossover-26.3.patch.xz | patch -d "$source_dir" -p1 -F0
          patch -d "$source_dir" -p1 -F0 < mcsoda/macos-disable-linux-futex.patch
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-disable-glibc-malloc.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-disable-linux-ntsync.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-disable-linux-teb-hack.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-disable-linux-cpu-topology.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-fix-clang-indirect-jump.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-use-portable-strchr.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-drop-obsolete-nsiproxy-wow64.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-fix-loader64-plist.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-drop-obsolete-unix-call-export.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-condition-loader64-preloader.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-merge-wddm-caps.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-fix-win32u-no-egl.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-include-pthread.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-condition-xfixes-warp.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-condition-xinput2-desktop.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-define-glx-renderer.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/mcsoda/macos-prepend-dll-path.patch"
          cd "$source_dir"
          ./tools/make_requests
          ./tools/make_specfiles
          ./dlls/winevulkan/make_vulkan -v
          autoreconf -fiv

      - name: Configure McSoda
        run: |
          source_dir="$RUNNER_TEMP/ValveSoftware-winegit"
          bison_prefix="$(brew --prefix bison)"
          flex_prefix="$(brew --prefix flex)"
          gettext_prefix="$(brew --prefix gettext)"
          brew_prefix="$(brew --prefix)"
          export PATH="$RUNNER_TEMP/ccache-bin:$RUNNER_TEMP/toolchain/bin:$bison_prefix/bin:$flex_prefix/bin:$gettext_prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$brew_prefix/opt/freetype/lib/pkgconfig:$brew_prefix/opt/gnutls/lib/pkgconfig:$brew_prefix/opt/gstreamer/lib/pkgconfig:$brew_prefix/opt/jpeg-turbo/lib/pkgconfig:$brew_prefix/opt/libpng/lib/pkgconfig:$brew_prefix/opt/libtiff/lib/pkgconfig:$brew_prefix/opt/libxml2/lib/pkgconfig:$brew_prefix/opt/libxslt/lib/pkgconfig:$brew_prefix/opt/molten-vk/lib/pkgconfig:$brew_prefix/opt/mpg123/lib/pkgconfig:$brew_prefix/opt/openal-soft/lib/pkgconfig:$brew_prefix/opt/sdl2-compat/lib/pkgconfig:$brew_prefix/opt/vulkan-loader/lib/pkgconfig"
          export CFLAGS="-O2 -g0 -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET -Wl,-headerpad_max_install_names"
          install -d "$RUNNER_TEMP/build" "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/build"
          "$source_dir/configure" \
            --prefix="$RUNNER_TEMP/install" \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --disable-amd_ags_x64 \
            --disable-tests \
            --with-mingw=llvm-mingw \
            --with-coreaudio \
            --with-freetype \
            --with-gnutls \
            --with-gstreamer \
            --with-sdl \
            --with-vulkan \
            --without-alsa \
            --without-capi \
            --without-cups \
            --without-dbus \
            --without-gphoto \
            --without-inotify \
            --without-netapi \
            --without-oss \
            --without-pulse \
            --without-sane \
            --without-udev \
            --without-v4l2 \
            --without-wayland \
            --without-xcomposite \
            --without-xcursor \
            --without-xfixes \
            --without-xinerama \
            --without-xinput \
            --without-xinput2 \
            --without-xrandr \
            --without-xrender \
            --without-xshape \
            --without-xshm \
            --without-xxf86vm

      - name: Show configure log on failure
        if: ${{ failure() }}
        run: |
          if test -f "$RUNNER_TEMP/build/config.log"; then tail -n 200 "$RUNNER_TEMP/build/config.log"; fi

      - name: Build and install McSoda
        run: |
          export PATH="$RUNNER_TEMP/ccache-bin:$RUNNER_TEMP/toolchain/bin:$PATH"
          ccache --zero-stats
          make -C "$RUNNER_TEMP/build" -j"$(sysctl -n hw.logicalcpu)"
          make -C "$RUNNER_TEMP/build" install
          ccache --show-stats

      - name: Save compiler cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: mcsoda-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_MINGW_VERSION }}-${{ env.VALVE_WINE_COMMIT }}-${{ hashFiles('.github/workflows/build-mcsoda.yml', 'mcsoda/*.patch', 'mcsoda/*.patch.xz', 'wine-tkg-userpatches/*.mypatch') }}

      - name: Bundle media support
        run: |
          plugin_dir="$(brew --prefix gstreamer)/lib/gstreamer-1.0"
          scanner="$(brew --prefix gstreamer)/libexec/gstreamer-1.0/gst-plugin-scanner"
          install -d "$RUNNER_TEMP/install/lib/gstreamer-1.0" "$RUNNER_TEMP/install/libexec/gstreamer-1.0"
          cp -RL "$plugin_dir"/. "$RUNNER_TEMP/install/lib/gstreamer-1.0/"
          install -m755 "$scanner" "$RUNNER_TEMP/install/libexec/gstreamer-1.0/gst-plugin-scanner"

      - name: Bundle Wine Mono and Gecko
        run: |
          mono_file="wine-mono-$WINE_MONO_VERSION-x86.msi"
          mono_url="https://github.com/wine-mono/wine-mono/releases/download/wine-mono-$WINE_MONO_VERSION/$mono_file"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$mono_file" "$mono_url"
          echo "$WINE_MONO_SHA256  $RUNNER_TEMP/$mono_file" | shasum -a 256 --check
          install -d "$RUNNER_TEMP/install/share/wine/mono"
          install -m644 "$RUNNER_TEMP/$mono_file" "$RUNNER_TEMP/install/share/wine/mono/$mono_file"

          install -d "$RUNNER_TEMP/install/share/wine/gecko"
          for gecko_arch in x86 x86_64
          do
            gecko_file="wine-gecko-$WINE_GECKO_VERSION-$gecko_arch.msi"
            gecko_url="https://dl.winehq.org/wine/wine-gecko/$WINE_GECKO_VERSION/$gecko_file"
            if test "$gecko_arch" = x86; then gecko_sha="$WINE_GECKO_X86_SHA256"; else gecko_sha="$WINE_GECKO_X86_64_SHA256"; fi
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/$gecko_file" "$gecko_url"
            echo "$gecko_sha  $RUNNER_TEMP/$gecko_file" | shasum -a 256 --check
            install -m644 "$RUNNER_TEMP/$gecko_file" "$RUNNER_TEMP/install/share/wine/gecko/$gecko_file"
          done

      - name: Bundle runtime libraries
        run: .github/scripts/bundle-macos-libraries.sh "$RUNNER_TEMP/install"

      - name: Add runner entry points
        run: |
          install -d "$RUNNER_TEMP/install/bin"
          if [[ -L "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64" && ! -e "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64" ]]; then
            rm "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64"
          fi
          if [[ ! -e "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64" ]]; then
            ln -s wine "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64"
          fi
          rm -f "$RUNNER_TEMP/install/bin/wine" "$RUNNER_TEMP/install/bin/wine64"
          install -m755 mcsoda/launcher.sh "$RUNNER_TEMP/install/bin/wine"
          ln -s wine "$RUNNER_TEMP/install/bin/wine64"
          head -n 1 "$RUNNER_TEMP/install/bin/wine" | grep -Fx '#!/bin/sh'
          test -x "$RUNNER_TEMP/install/bin/wine"
          test -x "$RUNNER_TEMP/install/bin/wine64"
          test -x "$RUNNER_TEMP/install/lib/wine/x86_64-unix/wine64"

      - name: Add McSoda metadata
        run: |
          install -d "$RUNNER_TEMP/install/share/mcsoda"
          install -m644 "$RUNNER_TEMP/ValveSoftware-winegit/COPYING.LIB" "$RUNNER_TEMP/install/share/mcsoda/COPYING.LIB"
          install -m644 mcsoda/SOURCES.json "$RUNNER_TEMP/install/share/mcsoda/SOURCES.json"
          printf '%s\n' \
            "GST_PLUGIN_SYSTEM_PATH_1_0=\$RUNNER/lib/gstreamer-1.0" \
            "GST_PLUGIN_SCANNER=\$RUNNER/libexec/gstreamer-1.0/gst-plugin-scanner" \
            > "$RUNNER_TEMP/install/share/mcsoda/runtime.env"
          test ! -e "$RUNNER_TEMP/install/libd3dshared.dylib"
          test ! -e "$RUNNER_TEMP/install/D3DMetal.framework"

      - name: Package McSoda
        run: |
          package="mcsoda-$WINE_VERSION-$REVISION-x86_64"
          mv "$RUNNER_TEMP/install" "$RUNNER_TEMP/$package"
          test -x "$RUNNER_TEMP/$package/bin/wine"
          test -x "$RUNNER_TEMP/$package/bin/wine64"
          test -x "$RUNNER_TEMP/$package/bin/wineserver"
          test -f "$RUNNER_TEMP/$package/lib/wine/x86_64-unix/winemac.so"
          test -f "$RUNNER_TEMP/$package/lib/wine/i386-windows/ntdll.dll"
          test -f "$RUNNER_TEMP/$package/lib/wine/x86_64-windows/ntdll.dll"
          while IFS= read -r link
          do
            test -e "$link" || { echo "Broken symlink: $link" >&2; exit 1; }
          done < <(find "$RUNNER_TEMP/$package" -type l -print)
          tar -cJf "$RUNNER_TEMP/$package.tar.xz" -C "$RUNNER_TEMP" "$package"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$package.tar.xz" > "$package.tar.xz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64
          path: |
            ${{ runner.temp }}/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.tar.xz
            ${{ runner.temp }}/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.tar.xz.sha256
          if-no-files-found: error

  smoke-test:
    needs:
      - build
      - normalize-reused-artifact
      - smoke-programs
    if: ${{ always() && !cancelled() && needs.smoke-programs.result == 'success' && (needs.normalize-reused-artifact.result == 'success' || needs.normalize-reused-artifact.result == 'skipped') && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '')) }}
    runs-on: macos-26

    steps:
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64-normalized
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: mcsoda-smoke-programs
          path: ${{ runner.temp }}/smoke
          github-token: ${{ github.token }}

      - name: Enable Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Verify archive and binaries
        run: |
          package="mcsoda-$WINE_VERSION-$REVISION-x86_64"
          cd "$RUNNER_TEMP/artifact"
          expected="$(cut -d ' ' -f 1 "$package.tar.xz.sha256")"
          actual="$(shasum -a 256 "$package.tar.xz" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          tar -xJf "$package.tar.xz"
          if [[ ! -e "$package/lib/wine/x86_64-unix/wine64" ]]; then
            ln -s wine "$package/lib/wine/x86_64-unix/wine64"
          fi
          head -n 1 "$package/bin/wine" | grep -Fx '#!/bin/sh'
          file "$package/lib/wine/x86_64-unix/wine" | grep -F 'x86_64'
          test -x "$package/lib/wine/x86_64-unix/wine64"
          file "$package/lib/wine/x86_64-unix/winemac.so" | grep -F 'x86_64'
          test -f "$package/lib/wine/i386-windows/ntdll.dll"
          test -f "$package/lib/wine/x86_64-windows/ntdll.dll"
          test ! -L "$package/lib/gstreamer-1.0/libgstnice.dylib"
          file "$package/lib/gstreamer-1.0/libgstnice.dylib" | grep -F 'x86_64'
          while IFS= read -r link
          do
            test -e "$link" || { echo "Broken symlink: $link" >&2; exit 1; }
          done < <(find "$package" -type l -print)
          ! find "$package" \( -name libd3dshared.dylib -o -name D3DMetal.framework \) -print -quit | grep -q .

      - name: Show audio devices
        run: system_profiler SPAudioDataType

      - name: Test McSoda through Rosetta
        run: |
          package="$RUNNER_TEMP/artifact/mcsoda-$WINE_VERSION-$REVISION-x86_64"
          export WINEPREFIX="$RUNNER_TEMP/mcsoda-prefix"
          export WINEDEBUG=-all
          env -u GST_PLUGIN_SYSTEM_PATH_1_0 -u GST_PLUGIN_SCANNER \
            "$package/bin/wine" --version | grep -F "$WINE_VERSION"
          arch -x86_64 "$package/lib/wine/x86_64-unix/wine64" --version | grep -F "$WINE_VERSION"

          d3dmetal_root="$RUNNER_TEMP/d3dmetal/lib"
          install -d "$d3dmetal_root/wine/i386-windows" "$d3dmetal_root/wine/x86_64-windows" "$d3dmetal_root/external"
          install -m644 "$package/lib/wine/i386-windows/d3d11.dll" "$d3dmetal_root/wine/i386-windows/d3d11.dll"
          install -m644 "$package/lib/wine/x86_64-windows/d3d11.dll" "$d3dmetal_root/wine/x86_64-windows/d3d11.dll"
          python3 - "$d3dmetal_root/wine/i386-windows/d3d11.dll" "$d3dmetal_root/wine/x86_64-windows/d3d11.dll" <<'PY'
          import struct
          import sys

          for path in sys.argv[1:]:
              with open(path, "r+b") as dll:
                  dll.seek(0x3c)
                  pe_offset = struct.unpack("<I", dll.read(4))[0]
                  dll.seek(pe_offset + 88)
                  checksum = struct.unpack("<I", dll.read(4))[0]
                  assert checksum != 0x4d435344
                  dll.seek(pe_offset + 88)
                  dll.write(struct.pack("<I", 0x4d435344))
          PY
          clang -arch x86_64 -dynamiclib "$RUNNER_TEMP/smoke/mcsoda-libd3dshared.c" -o "$d3dmetal_root/external/libd3dshared.dylib"
          clang -arch x86_64 "$RUNNER_TEMP/smoke/mcsoda-libd3dshared-test.c" -o "$RUNNER_TEMP/libd3dshared-test"
          codesign --force --sign - "$d3dmetal_root/external/libd3dshared.dylib"
          codesign --verify "$d3dmetal_root/external/libd3dshared.dylib"
          export MCSODA_D3DMETAL_ROOT="$d3dmetal_root"
          export MCSODA_D3DMETAL_SMOKE_MARKER="$RUNNER_TEMP/d3dmetal-loaded"
          rm -f "$MCSODA_D3DMETAL_SMOKE_MARKER"
          arch -x86_64 "$RUNNER_TEMP/libd3dshared-test" "$d3dmetal_root/external/libd3dshared.dylib" | grep -Fx 'McSoda external libd3dshared test'
          test -s "$MCSODA_D3DMETAL_SMOKE_MARKER"
          env -u WINEDLLPATH_PREPEND -u WINEDLLOVERRIDES -u CX_ACTIVE_GRAPHICS_BACKEND \
            -u CX_APPLEGPTK_LIBD3DSHARED_PATH "$package/bin/wine" wineboot -u
          for architecture in x86 x86_64
          do
            output="$(env -u WINEDLLPATH_PREPEND -u WINEDLLOVERRIDES -u CX_ACTIVE_GRAPHICS_BACKEND \
              -u CX_APPLEGPTK_LIBD3DSHARED_PATH "$package/bin/wine" "$RUNNER_TEMP/smoke/smoke-$architecture.exe" | tr -d '\r')"
            printf '%s\n' "$output" | grep -Fx 'McSoda window test'
            printf '%s\n' "$output" | grep -Fx 'McSoda input test'
            "$package/bin/wine" "$RUNNER_TEMP/smoke/audio-$architecture.exe" | tr -d '\r' | grep -Fx 'McSoda audio test'
          done
          for architecture in i686 x86_64
          do
            "$package/bin/wine" "$RUNNER_TEMP/smoke/dll-path-test-$architecture.exe" | tr -d '\r' | grep -Fx 'McSoda external DLL path test'
          done
          arch -x86_64 "$package/bin/wineserver" -k || true
          arch -x86_64 "$package/bin/wineserver" -w || true

  release:
    needs: smoke-test
    if: ${{ always() && needs.smoke-test.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          name: mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64-normalized
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}

      - name: Refresh checksum
        run: |
          package="mcsoda-$WINE_VERSION-$REVISION-x86_64"
          cd "$RUNNER_TEMP/artifact"
          shasum -a 256 "$package.tar.xz" > "$package.tar.xz.sha256"

      - name: Extract runner for SBOM
        run: |
          package="mcsoda-$WINE_VERSION-$REVISION-x86_64"
          install -d "$RUNNER_TEMP/sbom"
          tar -xJf "$RUNNER_TEMP/artifact/$package.tar.xz" -C "$RUNNER_TEMP/sbom"

      - uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/sbom/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64
          format: spdx-json
          output-file: ${{ runner.temp }}/artifact/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.spdx.json
          upload-artifact: false

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/artifact/mcsoda-${{ env.WINE_VERSION }}-${{ env.REVISION }}-x86_64.tar.xz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mcsoda-$WINE_VERSION-$REVISION"
          title="McSoda $WINE_VERSION-$REVISION"
          notes='<img src="https://raw.githubusercontent.com/bottlesdevs/data/main/logo/mcsoda-logo.svg" width="64" />

          McSoda is the macOS runner for Bottles Next. It keeps the Soda 11 Valve Wine base and adds the open macOS integration maintained by CodeWeavers. D3DMetal is supported as an external system component and is not included.'
          files=(
            "$RUNNER_TEMP/artifact/$tag-x86_64.tar.xz"
            "$RUNNER_TEMP/artifact/$tag-x86_64.tar.xz.sha256"
            "$RUNNER_TEMP/artifact/$tag-x86_64.spdx.json"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --latest=false
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest=false
          fi

      - name: Clean stale McSoda caches
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CACHE_KEY: mcsoda-source-v1-${{ env.VALVE_WINE_COMMIT }}-${{ env.WINE_TKG_COMMIT }}-${{ env.BUILD_TOOLS_COMMIT }}-${{ hashFiles('wine-tkg-userpatches/mod-loader-prefer-native.mypatch', 'wine-tkg-userpatches/ntdll-adaptive-launch-profile.mypatch', 'wine-tkg-userpatches/ntdll-handle-unmapped-unix-paths.mypatch', 'wine-tkg-userpatches/win32u-fill-depth-only-display-mode.mypatch') }}
          CCACHE_KEY: mcsoda-ccache-v1-macOS-X64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_MINGW_VERSION }}-${{ env.VALVE_WINE_COMMIT }}-${{ hashFiles('.github/workflows/build-mcsoda.yml', 'mcsoda/*.patch', 'mcsoda/*.patch.xz', 'wine-tkg-userpatches/*.mypatch') }}
        run: |
          for cache_spec in "mcsoda-source-v1-:$SOURCE_CACHE_KEY" "mcsoda-ccache-v1-:$CCACHE_KEY"
          do
            prefix="${cache_spec%%:*}"
            current_key="${cache_spec#*:}"
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 10000 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r cache_id cache_key
              do
                case "$cache_key" in
                  "$prefix"*)
                    if test "$cache_key" != "$current_key"; then gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"; fi
                    ;;
                esac
              done
          done
